# =============================================================================
#  NGINX — cổng vào duy nhất của toàn hệ thống
# =============================================================================
#  File này là cấu hình CHUNG. Cấu hình riêng của từng project nằm trong
#  conf.d/*.conf và được include ở cuối file.
#
#  Vì sao đặt ở gốc repo (deploy/nginx) chứ không nằm trong project con:
#  NGINX phục vụ ĐỒNG THỜI 4 project (Vue console, Vue admin cũ, Spring Boot,
#  Moodle). Nó là hạ tầng dùng chung, không thuộc về riêng project nào.
#  Mỗi project "sở hữu" đúng một file trong conf.d/ — vẫn đúng kiến trúc
#  (tách bạch trách nhiệm) mà vẫn gom được về một chỗ.
# =============================================================================

# Chạy trong container với user nginx (image nginx:alpine mặc định đã là nginx).
# Không đặt "user" ở đây vì image đã xử lý.

worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # Định dạng log
    # -------------------------------------------------------------------------
    # Giữ X-Forwarded-For và thời gian xử lý để còn debug được khi có sự cố.
    # ${DOLLAR} là cách viết "$" trong file template của image nginx chính thức:
    # entrypoint của image sẽ thay thế các biến môi trường trong /etc/nginx/templates/*.template,
    # nên phải escape để nó không hiểu nhầm "$remote_addr" là biến môi trường.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Kiểu MIME & hiệu năng cơ bản
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;            # không lộ phiên bản NGINX ra ngoài

    # -------------------------------------------------------------------------
    # Nén
    # -------------------------------------------------------------------------
    # Bật cho text/CSS/JS/JSON. KHÔNG nén ảnh (jpg/png) hay file đã nén sẵn
    # (zip, gz) vì nén lại chỉ tốn CPU mà không nhỏ hơn.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # Giới hạn kích thước thân request
    # -------------------------------------------------------------------------
    # Mặc định của NGINX là 1MB — quá nhỏ cho hai việc của đồ án này:
    #   1. Import câu hỏi (XML/Word/Excel) vào ngân hàng câu hỏi.
    #   2. Moodle: sao lưu / phục hồi khoá học, tải học liệu.
    # 32MB là mức an toàn cho cả hai; muốn chặt hơn thì giảm ở từng server block.
    client_max_body_size 32m;
    client_body_buffer_size 128k;

    # -------------------------------------------------------------------------
    # Bảo mật cơ bản
    # -------------------------------------------------------------------------
    # Ẩn header lộ thông tin máy chủ.
    # Lưu ý: chỉ đặt các header AN TOÀN cho mọi response. Header phụ thuộc
    # ngữ cảnh (CSP cho Moodle, HSTS khi có HTTPS) đặt ở từng server block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Giới hạn tần suất đăng nhập — bổ sung cho rate-limit đã làm trong backend.
    # Đặt ở tầng proxy vì request bị chặn ở đây KHÔNG tốn CPU của Spring Boot
    # (BCrypt rất đắt: một request đăng nhập sai tốn hàng chục ms CPU).
    # 10r/m = 10 request/phút cho mỗi IP; burst 5 cho phép bấm nhanh vài lần.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    # Giới hạn chung cho API, chặn client lỗi gọi quá dày.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    # Giới hạn mở WebSocket (mỗi lần mở tốn một kết nối tới backend).
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # Trả 429 thay vì để client treo chờ.
    limit_req_status 429;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    # Proxy chung: khi backend chết thì trả 502 ngay, không treo người dùng
    # -------------------------------------------------------------------------
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # -------------------------------------------------------------------------
    # Cấu hình riêng từng project
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
