# =============================================================================
#  Header chuyển tiếp cho mọi request proxy tới backend
# =============================================================================
#  ĐÂY LÀ PHẦN QUAN TRỌNG NHẤT của toàn bộ cấu hình NGINX trong đồ án này.
#
#  Backend (be-web-admin) đã bật `server.forward-headers-strategy: native`
#  trong application.yaml, kèm ghi chú: "Bật khi chạy sau nginx/proxy để
#  request.getRemoteAddr() trả IP thật".
#
#  Cơ chế: KHÔNG có các header dưới đây thì Spring Boot thấy mọi request đều
#  đến từ IP của container NGINX (172.x.x.x). Hệ quả cụ thể với đồ án:
#    - ntt_auth_audit_log.ip_address ghi sai -> không truy vết được ai đăng nhập.
#    - Tính năng thu hồi phiên theo IP dùng IP sai.
#    - Rate-limit theo IP (chống dò mật khẩu) coi TẤT CẢ người dùng là một
#      người -> chỉ cần một người thử sai vài lần là tất cả bị khoá.
#
#  NGUY HIỂM ĐI KÈM — đọc kỹ trước khi mở cổng backend ra ngoài:
#  `forward-headers-strategy: native` chỉ an toàn khi client KHÔNG THỂ gọi
#  thẳng vào cổng 8080. Nếu client gọi được thẳng 8080, nó tự đặt header
#  `X-Forwarded-For: 1.2.3.4` giả mạo và ghi sai audit log, vượt rate-limit.
#  Vì vậy trong docker-compose.yml cổng backend CHỈ bind vào 127.0.0.1
#  (dùng khi cần debug), và không bao giờ dùng 0.0.0.0.
# =============================================================================

# IP gốc của người dùng, giữ nguyên chuỗi nếu đã có nhiều lớp proxy.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# IP của máy kết nối trực tiếp tới NGINX (khác X-Forwarded-For: header kia là
# chuỗi, header này là một giá trị — Spring Boot dùng cái này khi tin cậy proxy).
proxy_set_header X-Real-IP         $remote_addr;

# Giao thức và host gốc. Spring Boot dùng để sinh URL tuyệt đối (link trong
# email kích hoạt, link đặt lại mật khẩu) và để kiểm tra Origin của WebSocket.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_set_header Host              $host;

# HTTP/1.0 mặc định của proxy không hỗ trợ keep-alive -> mỗi request mở một
# kết nối mới tới backend. Dùng 1.1 + xoá Connection để giữ kết nối.
proxy_http_version 1.1;
proxy_set_header Connection "";
