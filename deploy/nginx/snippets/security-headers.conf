# =============================================================================
#  Header bảo mật cho trang tĩnh (SPA) và API
# =============================================================================
#  Ở tầng này KHÔNG đặt Content-Security-Policy cho Moodle: Moodle nạp rất
#  nhiều script nội tuyến, một CSP sai sẽ làm hỏng trình soạn thảo và trang
#  làm bài. CSP nếu cần thì đặt riêng trong moodle.conf sau khi đã thử.
#
#  add_header trong NGINX có một cái bẫy: nếu một khối con (location, server)
#  tự khai báo add_header thì các add_header của khối cha BỊ MẤT HOÀN TOÀN,
#  không cộng dồn. Vì vậy các header dưới đây được gói thành snippet và
#  include lại ở từng nơi cần, thay vì khai báo ở http{} rồi tưởng là còn.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Spring Boot ở bản mới đã tự gửi một số header; trùng lặp không gây lỗi
# nhưng nếu muốn gọn thì bỏ bớt ở backend thay vì ở đây.

# Không cho trình duyệt dùng API như một trang HTML (chống XSS qua JSON).
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'" always;
