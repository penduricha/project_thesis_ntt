# =============================================================================
#  Server block mặc định
# =============================================================================
#  Khi request KHÔNG khớp server_name nào ở trên (gõ sai tên miền, gõ sai
#  cổng, hoặc dùng IP trực tiếp), NGINX rơi vào block này.
#
#  Vì sao KHÔNG trả 444 (đóng kết nối im lặng):
#  Với mô hình 3 cổng (5176 / 8085 / 8001), người dùng RẤT dễ gõ nhầm cổng.
#  Trả 444 thì trình duyệt chỉ hiện "ERR_EMPTY_RESPONSE" — không manh mối nào
#  để biết là sai cổng hay server chết. Rất mất thời gian khi demo trước hội
#  đồng. Trả một trang 404 kèm bảng cổng thì tự chẩn đoán được ngay.
#
#  Đánh đổi: trả nội dung là tiết lộ một chút thông tin về hệ thống. Với đồ án
#  tốt nghiệp chạy trên máy nội bộ, lợi ích (dễ debug) lớn hơn nhiều.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    # Endpoint cho Docker HEALTHCHECK và cho việc kiểm tra nhanh bằng curl.
    # Trả 200 ngay, KHÔNG phụ thuộc backend — vì nếu backend chết thì NGINX
    # vẫn đang phục vụ tốt, không được coi là chết theo.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        default_type text/html;
        return 404 '
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Không khớp tên miền — QBank</title>
<style>
  :root { color-scheme: light dark }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f8faff; color: #1b2a41; padding: 1.5rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1220; color: #e8eef7 }
    .box { background: #131c2e !important; border-color: #243349 !important }
    code { background: #1b2740 !important; color: #6cb0ea !important }
    th { color: #9aabc4 !important }
  }
  .box {
    background: #fff; border: 1px solid #e3ebf5; border-radius: 14px;
    padding: 2rem; max-width: 40rem; width: 100%;
    box-shadow: 0 20px 50px -30px rgba(16,42,80,.4);
  }
  h1 { margin: 0 0 .4rem; font-size: 1.35rem; letter-spacing: -.02em }
  p  { margin: 0 0 1.25rem; color: #5b6b82; font-size: .9rem }
  table { width: 100%; border-collapse: collapse; font-size: .85rem }
  th { text-align: left; font-size: .7rem; text-transform: uppercase;
       letter-spacing: .1em; color: #5b6b82; padding: 0 0 .5rem; font-weight: 600 }
  td { padding: .45rem 0; border-top: 1px solid #e3ebf5 }
  tr:first-child td { border-top: 0 }
  code { background: #eef3f9; padding: .15rem .45rem; border-radius: 5px;
         font-family: ui-monospace, Menlo, monospace; font-size: .82rem;
         color: #004b87; font-weight: 600 }
</style>
</head>
<body>
<div class="box">
  <h1>Không khớp tên miền nào</h1>
  <p>Request tới cổng này nhưng tên miền không có trong cấu hình. Dùng một trong các địa chỉ sau:</p>
  <table>
    <tr><th>Giao diện</th><th>Địa chỉ</th></tr>
    <tr><td>QBank Console</td><td><code>http://qbank.local:5176</code></td></tr>
    <tr><td>Quản trị cũ (fe_web_admin)</td><td><code>http://admin.local:8085</code></td></tr>
    <tr><td>Moodle</td><td><code>http://moodle.local:8001</code></td></tr>
  </table>
  <p style="margin:1.25rem 0 0;font-size:.8rem">
    Chưa thêm tên miền? Chạy <code>sudo bash deploy/hosts-setup.sh</code>
  </p>
</div>
</body>
</html>';
    }
}
