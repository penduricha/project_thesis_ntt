# =============================================================================
#  Server block mặc định + endpoint kiểm tra sức khoẻ
# =============================================================================
#  Vì sao cần server block mặc định:
#  Người dùng gõ IP máy chủ (hoặc một tên miền không khai báo) sẽ rơi vào
#  server block ĐẦU TIÊN theo thứ tự file trong conf.d/. Không có khối này
#  thì họ thấy trang mặc định của image NGINX hoặc bị lỗi khó hiểu.
#
#  Ở đây trả 444 (đóng kết nối ngay, không trả gì) — lựa chọn phổ biến để
#  không cung cấp thông tin cho công cụ quét. Nhưng healthz phải còn chạy
#  được để Docker kiểm tra sức khoẻ, nên nó được khai báo TRƯỚC và khớp
#  chính xác.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    # Endpoint cho Docker HEALTHCHECK. Phải trả 200 nhanh, không đụng backend
    # (nếu phụ thuộc backend thì khi backend chết, NGINX bị coi là chết theo
    # và container bị restart — sai, vì NGINX vẫn đang phục vụ tốt).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Mọi đường dẫn khác: đóng kết nối, không trả nội dung.
    location / {
        return 444;
    }
}
