# =============================================================================
#  moodle.local — Moodle 5.3 (php_moodle_503)
# =============================================================================
#  DÙNG SUBDOMAIN, KHÔNG DÙNG SUBPATH (/moodle).
#
#  Lý do (rất quan trọng, đổi sau sẽ rất đau):
#  1. $CFG->wwwroot của Moodle phải KHỚP TUYỆT ĐỐI với URL người dùng mở.
#  2. Moodle sinh URL TUYỆT ĐỐI trong hàng trăm chỗ (CSS, JS, form action,
#     redirect, link khoá học). Chạy ở subpath thì phải sửa wwwroot và
#     đảm bảo mọi asset đều qua prefix, rất dễ sinh link sai 404.
#  3. Cookie phiên của Moodle mặc định theo path. Nằm ở "/" thì dùng chung
#     với SPA Vue -> dễ xung đột tên.
#  Subdomain sạch sẽ tuyệt đối và là cách Moodle khuyến nghị.
#
#  LƯU Ý: file này là cấu hình của TÔI (hạ tầng), KHÔNG sửa gì trong
#  php_moodle_503/. Nếu cần đổi $CFG->wwwroot thì đó là việc của chủ project
#  Moodle đang làm theme — xem README trong thư mục này.
# =============================================================================

server {
    listen 80;
    server_name moodle.local;

    # -----------------------------------------------------------------------
    # Document root = public/, KHÔNG phải thư mục gốc của Moodle.
    # -----------------------------------------------------------------------
    # Moodle 5.x dùng cấu trúc mới: toàn bộ file công khai nằm trong public/,
    # còn config.php / admin/cli / version.php nằm ở thư mục cha. Nếu trỏ
    # root vào thư mục cha, người ngoài tải được config.php (chứa mật khẩu
    # CSDL) và toàn bộ mã nguồn -> lỗ hổng nghiêm trọng.
    # Đây là lý do "webroot = public/" là một cải tiến bảo mật của Moodle 5.
    root /var/www/moodle/public;
    index index.php;

    # Moodle tạo khoá học có học liệu, sao lưu khoá học -> cần giới hạn lớn.
    client_max_body_size 512m;
    client_body_timeout 300s;

    # Moodle có thể chạy lâu (sao lưu, phục hồi, sinh báo cáo).
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;

    # Không đặt X-Frame-Options ở đây: Moodle dùng iframe nội bộ cho một số
    # hoạt động (SCORM, H5P, trình soạn thảo). Chặn frame sẽ làm hỏng chúng.
    # Chỉ đặt các header an toàn tuyệt đối.
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/moodle.access.log main;
    error_log  /var/log/nginx/moodle.error.log warn;

    # -----------------------------------------------------------------------
    # File tĩnh của Moodle: CSS/JS/ảnh/font do theme sinh ra
    # -----------------------------------------------------------------------
    # Moodle gom CSS/JS thành file có hash trong /theme/... và /lib/javascript.php.
    # Cache dài hạn là an toàn vì mỗi lần purge cache Moodle đổi tên file.
    # Riêng /pluginfile.php và /draftfile.php phải đi qua PHP (xem bên dưới)
    # vì chúng kiểm tra quyền truy cập.
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Chặn truy cập trực tiếp vào thư mục nội bộ của Moodle
    # -----------------------------------------------------------------------
    # Những đường dẫn dưới đây KHÔNG bao giờ được phục vụ trực tiếp:
    # chúng chứa mã cấu hình, dữ liệu nội bộ hoặc chỉ dùng qua CLI.
    location ~* ^/(admin/cli|admin/tool/.*/cli|local/.*/cli)/ {
        deny all;
        return 404;
    }
    location ~* /\.(git|env|htaccess) {
        deny all;
        return 404;
    }
    # Thư mục chứa mã nguồn PHP ở cấp trên public/ — không thể truy cập được
    # vì root đã trỏ vào public/, nhưng chặn thêm cho chắc.
    location ~* ^/(config\.php|version\.php|composer\.(json|lock)|Gruntfile\.js)$ {
        deny all;
        return 404;
    }

    # -----------------------------------------------------------------------
    # PHP-FPM
    # -----------------------------------------------------------------------
    # Mọi file .php đi qua PHP-FPM. Dùng fastcgi_pass tới service "moodle_php"
    # trong docker-compose.yml (cùng container chạy php-fpm + cron).
    location ~ \.php$ {
        # Chống path traversal: nếu file không tồn tại thì để PHP trả 404,
        # KHÔNG đưa đường dẫn tuỳ ý vào SCRIPT_FILENAME.
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass moodle_php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Quan trọng khi chạy sau reverse proxy: Moodle dùng các header này để
        # nhận biết IP người dùng và giao thức. Nếu thiếu, log của Moodle ghi
        # IP của container NGINX cho mọi người và link trong email sai.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP       $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
    }

    # -----------------------------------------------------------------------
    # Định tuyến mặc định
    # -----------------------------------------------------------------------
    # Moodle KHÔNG phải SPA: chỉ cần thử file/thư mục thật, còn lại để
    # public/index.php xử lý (nó đọc $CFG->wwwroot và tự tìm module).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -----------------------------------------------------------------------
    # Chặn phía sau: không cho truy cập vào dataroot
    # -----------------------------------------------------------------------
    # dataroot (mặc định /var/www/moodledata) PHẢI nằm ngoài docroot.
    # Nó chứa bài làm của sinh viên, file tải lên, cache — nếu lộ là lỗ hổng
    # nghiêm trọng. Ở đây docker-compose gắn nó vào /var/www/moodledata,
    # nằm ngoài public/ nên không phục vụ được; chốt thêm một lớp nữa.
    location ^~ /moodledata/ {
        deny all;
        return 404;
    }
}
