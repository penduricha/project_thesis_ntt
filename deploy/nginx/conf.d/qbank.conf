# =============================================================================
#  qbank.local — QBank Console (qbank-console-vue3)
# =============================================================================
#  Trang quản trị chính của đồ án: ngân hàng câu hỏi, kiểm định AI, quản trị
#  người dùng, chat giữa các admin.
#
#  Router dùng createWebHashHistory() nên đường dẫn thật chỉ có "/" và phần
#  sau dấu # do trình duyệt xử lý, KHÔNG gửi lên server. Nhờ vậy không cần
#  rewrite gì cả — đây là lý do hash router "dễ triển khai hơn history router"
#  và cũng là điều đáng nói trong báo cáo.
#
#  ---------------------------------------------------------------------------
#  GHI CHÚ VỀ CẤU TRÚC location — đọc trước khi sửa:
#  Các location dưới đây được khai báo PHẲNG (anh em với nhau), KHÔNG lồng
#  nhau. Lý do kỹ thuật: khi request khớp vào một location tiền tố
#  (location /api/), NGINX DỪNG tìm kiếm và các location con bên trong nó
#  bị bỏ qua hoàn toàn. Nghĩa là:
#      location /api/ {
#          location = /api/mobile/chat/ws { ... }   # KHÔNG BAO GIỜ CHẠY
#      }
#  Viết như vậy là cú pháp sai (nginx -t sẽ báo lỗi "location directive is
#  not allowed here"). Phải khai báo phẳng và dùng regex/prefix để ưu tiên.
#  ---------------------------------------------------------------------------
# =============================================================================

server {
    listen 80;
    server_name qbank.local;

    # Thư mục chứa bản build đã COPY vào image NGINX (xem Dockerfile).
    root /usr/share/nginx/html/qbank;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # -------------------------------------------------------------------------
    # WebSocket chat giữa admin  —  PHẢI đặt TRƯỚC location /api/
    # -------------------------------------------------------------------------
    # Dùng "location = " (so khớp CHÍNH XÁC) nên nó thắng mọi location tiền tố,
    # bất kể thứ tự trong file. Vẫn đặt lên đầu cho dễ đọc.
    #
    # PATH trong ChatWebSocketConfig là /mobile/chat/ws, cộng context-path
    # /api của Spring Boot -> đường dẫn đầy đủ /api/mobile/chat/ws.
    location = /api/mobile/chat/ws {
        limit_conn ws_conn 10;

        # BẮT BUỘC: thiếu hai dòng này thì handshake WebSocket trả về 400 và
        # chat không bao giờ kết nối được.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # BẮT BUỘC: mặc định proxy_read_timeout 60s sẽ CẮT kết nối WebSocket
        # đang im lặng. Backend đặt chat.ws.idle-timeout-seconds = 50s với ghi
        # chú "nhỏ hơn mốc 60s của Nginx" — nghĩa là backend chủ động đóng
        # trước. Nếu NGINX cũng đóng ở 60s thì hai bên tranh nhau, log đầy
        # lỗi 499/1006 rất khó hiểu. Nâng lên 3600s để chỉ backend quyết định.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # WebSocket là kết nối dài: KHÔNG buffer, nếu buffer tin nhắn bị giữ
        # lại và chat có độ trễ (hoặc mất tin).
        proxy_buffering off;

        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://be_web_admin:8080;
    }

    # -------------------------------------------------------------------------
    # Endpoint đăng nhập  —  giới hạn chặt hơn phần còn lại
    # -------------------------------------------------------------------------
    # Đây là dòng quan trọng về DevOps: request bị chặn ở tầng proxy KHÔNG
    # tốn CPU của Spring Boot. Mà BCrypt (kiểm mật khẩu) rất đắt — mỗi lần
    # thử sai tốn hàng chục ms CPU. Chặn ở đây là chặn trước khi trả giá đó.
    #
    # Dùng regex (~) nên nó thắng location tiền tố /api/ khi khớp.
    location ~ /api/(web/admin|mobile)/(auth|login) {
        limit_req zone=login_zone burst=5 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://be_web_admin:8080;
    }

    # -------------------------------------------------------------------------
    # API -> Spring Boot (be-web-admin)
    # -------------------------------------------------------------------------
    # Giữ nguyên đường dẫn: backend có context-path /api nên /api/web/... tới
    # đúng controller mà không phải viết lại gì (không rewrite = ít lỗi hơn).
    #
    # Dùng chung origin với trang web -> CORS gần như biến mất khỏi phương
    # trình. Trước đây backend phải khai 6 origin (localhost:5173,
    # 127.0.0.1:5173, :5174, :5375...) trong application.yaml; giờ chỉ cần
    # khai đúng origin công khai của NGINX.
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://be_web_admin:8080;
    }

    # -------------------------------------------------------------------------
    # Tài nguyên tĩnh của bản build Vite
    # -------------------------------------------------------------------------
    # Vite sinh tên file có hash nội dung (index-CRqC63Ma.js). Với cùng một
    # tên, nội dung không bao giờ đổi -> cache vĩnh viễn là an toàn, và đây
    # là chỗ cải thiện tốc độ rõ rệt nhất.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html TUYỆT ĐỐI không cache: nếu cache, người dùng mãi chạy bản cũ
    # trỏ tới các file assets đã bị xoá sau lần deploy tiếp theo (lỗi kinh
    # điển "trắng trang sau khi cập nhật").
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # favicon, manifest, ảnh... cache ngắn.
    location ~* \.(ico|png|jpg|jpeg|svg|webp|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Không để lộ file cấu hình nếu có ai đó vô tình copy vào.
    location ~* /\.(env|git) {
        deny all;
        return 404;
    }

    # -------------------------------------------------------------------------
    # SPA fallback
    # -------------------------------------------------------------------------
    # Với hash router thì "/" là đủ. Vẫn giữ try_files để nếu sau này chuyển
    # sang createWebHistory() thì không phải sửa cấu hình NGINX lần nữa.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
