# =============================================================================
#  admin.local — fe_web_admin (Vue cũ)
# =============================================================================
#  KHÁC BIỆT QUAN TRỌNG so với qbank.conf — đọc kỹ nếu không sẽ trắng trang:
#
#  fe_web_admin dùng createWebHistory() (src/main.js), KHÔNG phải hash router.
#  Nghĩa là người dùng bấm F5 khi đang ở /students sẽ gửi nguyên đường dẫn
#  /students lên server. Nếu NGINX không có `try_files ... /index.html` thì
#  nó trả 404 vì không có file nào tên là "students".
#
#  qbank-console-vue3 thì ngược lại: hash router nên phần sau # không bao giờ
#  tới server, try_files chỉ là để dự phòng.
# =============================================================================

server {
    listen 80;
    server_name admin.local;

    root /usr/share/nginx/html/admin;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # -------------------------------------------------------------------------
    # API dùng chung backend với qbank.local.
    # Thứ tự/sự lồng nhau: xem ghi chú chi tiết ở đầu qbank.conf — các
    # location ở đây PHẢI PHẲNG, không lồng trong location /api/.
    # -------------------------------------------------------------------------

    # WebSocket chat (khớp chính xác, thắng location tiền tố).
    location = /api/mobile/chat/ws {
        limit_conn ws_conn 10;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://be_web_admin:8080;
    }

    # Đăng nhập: giới hạn chặt hơn.
    location ~ /api/(web/admin|mobile)/(auth|login) {
        limit_req zone=login_zone burst=5 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://be_web_admin:8080;
    }

    # Phần API còn lại.
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://be_web_admin:8080;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location ~* /\.(env|git) {
        deny all;
        return 404;
    }

    # ĐÂY là dòng khác biệt so với qbank.conf: history router cần fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
