<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QBank Console – Kiểm định ngân hàng câu hỏi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#004b87;--primary-hover:#003a69;--primary-soft:#e8f1fa;
  --danger-strong:#a51818;--danger-hover:#8a1414;--danger-soft:#fdeeee;--danger-border:#f3c3c3;
  --success-strong:#166534;--success-soft:#e8f6ee;--success-border:#bfe5cc;
  --warning-soft:#fff8e1;--warning-border:#f2cf7a;--warning-strong:#9a5b00;--warning-badge-bg:#fdecb3;
  --text:#1b2a41;--text-muted:#5b6b82;--bg:#f8faff;--surface:#fff;--surface-hover:#f1f5fa;
  --border:#e3ebf5;--border-strong:#8596ad;
  --space-1:.5rem;--space-2:1rem;--space-3:1.5rem;--space-4:2rem;--space-5:3rem;
  --radius:8px;--shadow-card:0 1px 2px rgba(19,82,157,.06);
  --page-padding-x:1rem;--tile:color-mix(in srgb,var(--primary) 3%,var(--surface));
  --fs:1rem;--fs-sm:.875rem;--fs-xs:.8125rem;--topbar-h:3.5rem;
  --font:"Be Vietnam Pro",Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(max-width:360px){:root{--page-padding-x:.75rem}}
@media(min-width:768px){:root{--page-padding-x:1.5rem;--topbar-h:3.75rem}}
@media(min-width:1024px){:root{--page-padding-x:2rem}}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--topbar-h) + env(safe-area-inset-top,0px));background:#003a69}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:var(--font);font-size:var(--fs);line-height:1.55;color:var(--text);background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--primary);z-index:41}
button,input,select,textarea{font-family:inherit}:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3,h4,p,dl,dd{margin:0}b,th,h1,h2,h3,h4{font-weight:700}.mut,small{color:var(--text-muted)}small{display:block;font-size:var(--fs-sm);line-height:1.4}

/* Skip link A11y */
.skip{position:absolute;left:-9999px;text-decoration:none;font-weight:700}
.skip:focus{left:1rem;top:1rem;z-index:100;padding:.5rem 1rem;background:var(--primary);color:#fff;border-radius:var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* Shell & Topbar */
.shell{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"head" "main";min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.topbar{grid-area:head;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:.75rem;height:var(--topbar-h);padding:0 var(--page-padding-x) 0 .5rem;background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(0,30,60,.25)}
.topbar__toggle{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:44px;height:44px;padding:0;border:0;border-radius:var(--radius);background:transparent;cursor:pointer;transition:background-color .2s ease}
.topbar__toggle span{display:block;flex:none;width:22px;height:2px;border-radius:1px;background:#fff}
.topbar__toggle:hover{background:rgba(255,255,255,.16)}.topbar__toggle:focus-visible{outline-color:#fff}

/* Brand Logo in Topbar */
.logo-link{display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;color:#fff;padding:.3rem .6rem;border-radius:var(--radius);transition:background-color .2s ease}
.logo-link:hover{background:rgba(255,255,255,.12)}.logo-link:focus-visible{outline-color:#fff}
.logo-badge{display:grid;place-items:center;width:1.875rem;height:1.875rem;border-radius:6px;background:#fff;color:var(--primary);font-weight:800;font-size:.9375rem;letter-spacing:-.02em}
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-text strong{font-size:1rem;letter-spacing:-.01em}
.logo-text span{font-size:.6875rem;color:rgba(255,255,255,.8);font-weight:500}
@media(max-width:420px){.logo-text span{display:none}}

/* Account Menu */
.acct{position:relative;margin-left:auto}
.acct__btn{display:flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:0 .5rem 0 .25rem;border:0;border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background-color .2s ease}
.acct__btn:hover,.acct__btn[aria-expanded=true]{background:rgba(255,255,255,.16)}
.acct__btn:hover .av{box-shadow:0 0 0 3px rgba(255,255,255,.4)}.acct__btn:focus-visible{outline-color:#fff}
.av{flex:none;display:grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:50%;background:#fff;color:var(--primary);font-size:.9375rem;font-weight:700;line-height:1;transition:box-shadow .2s ease}
.acct__chev{width:.45rem;height:.45rem;margin-top:-.2rem;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);transition:transform .2s ease}
.acct__btn[aria-expanded=true] .acct__chev{margin-top:.2rem;transform:rotate(-135deg)}
.acct__menu{position:absolute;right:0;top:calc(100% + .5rem);z-index:45;width:min(18rem,calc(100vw - 2rem));padding-bottom:.5rem;overflow:hidden;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,30,60,.28);animation:menu-in .2s ease both}
@keyframes menu-in{from{opacity:0;transform:translateY(-.5rem)}to{opacity:1;transform:none}}
.who{display:flex;align-items:center;gap:.75rem;min-width:0}
.acct__head{margin-bottom:.5rem;padding:var(--space-2);border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--primary-soft),var(--surface) 70%)}
.acct__head .av{background:var(--primary);color:#fff}.av--lg{width:2.75rem;height:2.75rem;font-size:1.0625rem}
.acct__item{display:flex;align-items:center;width:100%;min-height:2.625rem;padding:0 var(--space-2) 0 calc(var(--space-2) - 4px);border:0;border-left:4px solid transparent;background:transparent;color:var(--text);font:inherit;font-size:var(--fs-sm);text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease,border-color .15s ease}
.acct__item:hover{background:var(--primary-soft);color:var(--primary);border-left-color:var(--primary)}
.acct__item.out:hover{background:var(--danger-soft);color:var(--danger-strong);border-left-color:var(--danger-strong)}
.acct__sep{height:1px;margin:.4rem 0;background:var(--border)}

/* Sidebar */
.sidebar{grid-area:side;position:fixed;z-index:35;top:calc(var(--topbar-h) + env(safe-area-inset-top,0px));bottom:0;left:0;width:min(18rem,86vw);display:flex;flex-direction:column;padding:.5rem 0 calc(1rem + env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .25s ease}
[data-nav=open] .sidebar{transform:none;box-shadow:0 0 40px rgba(0,30,60,.3)}
.scrim{display:none}@media(max-width:767.98px){[data-nav=open] .scrim{display:block;position:fixed;inset:0;z-index:34;background:rgba(27,42,65,.55)}}
#menu{display:flex;flex-direction:column;padding:.25rem 0}
.nav-group{margin:1.25rem 1.25rem .35rem;color:var(--text-muted);font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.nav-group:first-child{margin-top:.5rem}
.nv{display:flex;align-items:center;justify-content:flex-start;gap:.75rem;width:auto;margin:2px .75rem;min-height:2.625rem;padding:0 .875rem;border:0;border-radius:var(--radius);background:transparent;color:var(--text);font:inherit;font-size:var(--fs-sm);font-weight:500;text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.nv svg{flex:none;width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv em{margin-left:auto;display:grid;place-items:center;min-width:1.4rem;height:1.4rem;padding:0 .35rem;border-radius:999px;background:var(--danger-strong);color:#fff;font-style:normal;font-size:.75rem;font-weight:700;line-height:1}
.nv:hover{background:var(--surface-hover);color:var(--primary)}
.nv.on,.nv.on:hover{background:var(--primary);color:#fff;font-weight:600}
.nv.on em{background:var(--danger-strong);color:#fff;box-shadow:0 0 0 2px #fff}

@media(min-width:768px){
  .shell{grid-template-columns:15.5rem minmax(0,1fr);grid-template-areas:"head head" "side main"}
  .sidebar{position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top,0px));bottom:auto;width:auto;height:calc(100dvh - var(--topbar-h) - env(safe-area-inset-top,0px));transform:none;transition:none;box-shadow:none!important}
  .shell[data-nav=closed]{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main"}
  [data-nav=closed] .sidebar{display:none}
}
@media(min-width:1024px){.shell{grid-template-columns:17.5rem minmax(0,1fr)}.nv{min-height:2.875rem;font-size:.9375rem}.nv svg{width:1.35rem;height:1.35rem}}

/* Main Layout */
.content{grid-area:main;min-width:0;display:flex;flex-direction:column}
.page{width:100%;max-width:78rem;margin:0 auto;padding:var(--space-3) var(--page-padding-x);flex:1}@media(min-width:768px){.page{padding-block:var(--space-4)}}
.page__head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:var(--space-1) var(--space-3);margin-bottom:1.25rem}
@media(min-width:768px){.page__head{align-items:center;flex-wrap:nowrap}}
.page__title{font-size:1.5rem;line-height:1.3}.page__sub{margin-top:.25rem;color:var(--text-muted);font-size:var(--fs-sm)}
#pact{display:flex;flex-wrap:wrap;gap:.5rem}#pact:empty{display:none}
#view{display:flex;flex-direction:column;gap:var(--space-3)}
.foot{padding:var(--space-2) var(--page-padding-x);background:#003a69;color:rgba(255,255,255,.78);font-size:var(--fs-xs);text-align:center}

/* Buttons & Badges */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.5rem;padding:0 var(--space-2);border:1px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text);font:inherit;font-size:var(--fs-sm);font-weight:600;line-height:1.2;cursor:pointer;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.btn:hover{background:var(--surface-hover);border-color:var(--text-muted)}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}.btn.pri:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.dan{background:var(--danger-strong);border-color:var(--danger-strong);color:#fff}.btn.dan:hover{background:var(--danger-hover);border-color:var(--danger-hover)}
.btn.sm{min-height:2.125rem;padding:0 .75rem;font-size:var(--fs-xs)}
.btn.del:hover{background:var(--danger-soft);border-color:var(--danger-strong);color:var(--danger-strong)}
.btn.ghost{border-color:transparent;padding-inline:.5rem;color:var(--primary)}.btn.ghost:hover{background:var(--primary-soft)}
.btn.w100{width:100%}

.b{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .65rem;border:1px solid transparent;border-radius:999px;font-size:var(--fs-xs);font-weight:700;line-height:1.2;white-space:nowrap;background:var(--primary-soft);color:var(--primary)}
.b.ok{background:var(--success-soft);border-color:var(--success-border);color:var(--success-strong)}
.b.er{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger-strong)}
.b.wa{background:var(--warning-badge-bg);border-color:var(--warning-border);color:#7a4a00}
.b.n{background:var(--surface-hover);border-color:var(--border);color:var(--text-muted)}
.b.code{border-radius:6px;font-family:ui-monospace,Consolas,monospace;letter-spacing:.02em}

/* Cards & Grids */
.card{display:flex;flex-direction:column;gap:1rem;min-width:0;padding:var(--space-2);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-card)}
@media(min-width:768px){.card{padding:var(--space-3)}}
.card__head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem}
h3{color:var(--text);font-size:1.0625rem;line-height:1.4}h4{color:var(--text-muted);font-size:var(--fs-sm)}
.cols{display:grid;gap:var(--space-3);align-items:start;grid-template-columns:minmax(0,1fr)}
@media(min-width:1024px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Dashboard Stats & Columns */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2)}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{--c:var(--primary);gap:.35rem;padding:1.15rem 1.25rem;border-radius:10px;border-left:3px solid var(--c);text-align:left;cursor:pointer;transition:border-color .15s ease,background-color .15s ease}
.stat:nth-child(2){--c:var(--success-strong)}.stat:nth-child(3){--c:var(--warning-strong)}.stat:nth-child(4){--c:var(--danger-strong)}
.stat:hover{border-color:var(--c);background:var(--tile)}
.stat .mut{display:flex;align-items:center;gap:.45rem;font-size:var(--fs-sm)}
.stat .mut::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--c)}
.stat b{color:var(--text);font-size:1.875rem;line-height:1.2}
.stat b.zero{color:var(--text-muted);font-weight:600}
.stat__sub{font-size:var(--fs-xs);color:var(--text-muted)}

.dashcols{align-items:stretch}@media(min-width:1280px){.dashcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dashcols>.card{min-height:17rem}
.flow-box{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.65rem .85rem;border-radius:var(--radius);background:var(--tile);border:1px solid var(--border);font-size:var(--fs-xs);font-weight:600;color:var(--primary)}
.flow-box span{color:var(--text-muted);font-weight:400}

/* Service Box & Logs */
.two_fa{display:flex;flex-direction:column;gap:var(--space-2);padding:1rem;border:1px solid transparent;border-radius:var(--radius);transition:border-color .2s ease}
.two_fa--on{background:var(--success-soft);border-color:var(--success-border)}.two_fa--off{background:var(--danger-soft);border-color:var(--danger-border)}
.svc{flex:1;justify-content:space-between}.two_fa__status{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .65rem;font-weight:700;margin-bottom:.25rem}
.two_fa__desc{color:var(--text-muted);font-size:var(--fs-sm)}.svc .btn{width:100%;background:var(--surface)}.svc .btn.pri{background:var(--primary)}

ul.lg{list-style:none;margin:0;padding:0;flex:1;min-height:0;max-height:16rem;overflow-y:auto;padding-right:.35rem}
ul.lg li{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .5rem;border-bottom:1px solid var(--border);font-size:var(--fs-sm);transition:background-color .15s ease}
ul.lg li:hover{background:var(--tile)}ul.lg li:last-child{border-bottom:0}
.dot{flex:none;width:.5rem;height:.5rem;margin-top:.45rem;border-radius:50%;background:var(--primary)}
.dot.ok{background:var(--success-strong)}.dot.er{background:var(--danger-strong)}.dot.wa{background:var(--warning-strong)}
.lg::-webkit-scrollbar{width:.45rem}.lg::-webkit-scrollbar-track{background:var(--primary-soft);border-radius:4px}.lg::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px}

/* Forms & Inputs */
input,select,textarea{font:inherit;font-size:var(--fs-sm);color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:.5rem .75rem;min-height:2.5rem;max-width:100%;transition:border-color .15s ease}
input:hover,select:hover,textarea:hover{border-color:var(--primary)}
input[type=checkbox],input[type=radio]{min-height:0;width:1.25rem;height:1.25rem;padding:0;flex:none;accent-color:var(--primary);cursor:pointer}
input[type=file]{width:100%;padding:.4rem .6rem;cursor:pointer}
input[type=file]::file-selector-button{margin-right:.75rem;padding:.35rem .75rem;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface-hover);color:var(--text);font:inherit;font-size:var(--fs-xs);font-weight:600;cursor:pointer;transition:background-color .15s ease}
input[type=file]::file-selector-button:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
textarea{width:100%}
label{display:block;margin:0;color:var(--text-muted);font-size:var(--fs-sm)}
label>input:not([type=checkbox]),label>textarea,label>select{display:block;width:100%;margin-top:.35rem;color:var(--text);font-size:var(--fs)}
.bar{display:flex;flex-wrap:wrap;gap:var(--space-1);align-items:center}
.bar select,.bar .btn{flex:1 1 8.5rem}
.grow{flex:1 1 auto;min-width:0}
@media(min-width:768px){.bar .btn{flex:none}}
.end{display:flex;flex-wrap:wrap;gap:var(--space-1);justify-content:flex-end}

/* 4-column equal button row for Moodle Export */
.btn-grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
@media(min-width:640px){.btn-grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.btn-grid4 .btn{width:100%;padding-inline:.5rem}

/* Search Input & Compact Filter Controls */
.srch-box{position:relative;flex:1 1 100%;display:flex;align-items:center}
.srch-box input{width:100%;padding-right:.75rem}
.srch-clear{position:absolute;right:.4rem;width:1.75rem;height:1.75rem;border:0;border-radius:50%;background:transparent;color:var(--text-muted);font-size:1.125rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.srch-clear:hover{background:var(--surface-hover);color:var(--text)}

.tools .flt-sel{padding-inline:.65rem;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.flt-course{flex:1 1 11rem;min-width:0}
.srch-box input:not(:placeholder-shown){padding-right:2.25rem}
.tb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-1);align-items:stretch}
.tb>*{min-width:0}
.tb .flt-sel,.tb>.btn{width:100%}
.tb .srch-box,.tb .flt-course{grid-column:1/-1}
@media(min-width:768px){.tb{grid-template-columns:repeat(4,minmax(0,1fr))}.tb .flt-course,.tb select[aria-label="Sắp xếp"],.tb>.btn{grid-column:span 2}}
@media(min-width:1440px){.tb{grid-template-columns:minmax(var(--srch-w,18rem),1.7fr) minmax(10rem,1.3fr) repeat(3,minmax(6.5rem,.8fr)) auto}.tb .srch-box,.tb .flt-course,.tb select[aria-label="Sắp xếp"],.tb>.btn{grid-column:auto}.tb.tb-nc{grid-template-columns:minmax(var(--srch-w,18rem),2fr) repeat(3,minmax(6.5rem,.9fr)) auto}}
.cc-chips{flex:none;display:flex;flex-wrap:wrap;gap:.35rem;max-height:8.5rem;overflow:auto}
.cc-chips .btn{flex:0 1 auto;white-space:normal;text-align:left}
.cc-f{display:block;color:var(--text-muted);font-size:var(--fs-sm)}.cc-f .cc-chips{margin-top:.5rem}
.cb{position:relative;display:block;width:100%}label .cb{margin-top:.35rem}
.cb .cb-in,.tools .cb .cb-in{width:100%;padding-right:2.25rem;text-overflow:ellipsis}
.cb-btn{position:absolute;right:.25rem;top:50%;transform:translateY(-50%);width:2rem;height:2rem;border:0;border-radius:var(--radius);background:transparent;color:var(--text-muted);cursor:pointer}
.cb-btn:hover{background:var(--surface-hover)}
.cb-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:80;margin:0;padding:.25rem;list-style:none;max-height:min(16rem,45vh);overflow:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:0 8px 24px rgba(19,40,80,.16)}
.cb-list li{padding:.5rem .65rem;border-radius:6px;color:var(--text);font-size:var(--fs-sm);cursor:pointer}
.cb-list li:hover,.cb-list li.act{background:var(--surface-hover)}
.cb-list li.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.cb-list li.none{color:var(--text-muted);cursor:default}
input.invalid,textarea.invalid,select.invalid,.cc-chips.invalid{border-color:var(--danger-strong)!important;box-shadow:0 0 0 1px var(--danger-strong)}
.cc-chips.invalid{padding:.4rem;border:1px solid var(--danger-strong);border-radius:var(--radius)}
.fe{display:block;margin-top:.3rem;color:var(--danger-strong);font-size:var(--fs-sm);font-weight:600;line-height:1.35}
.opt+.fe{margin:-.25rem 0 .25rem 2.9rem}
.lm__f{display:grid;gap:var(--space-2);grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
@media(max-width:767px){.lm__f{grid-template-columns:minmax(0,1fr)}}
@media(min-width:1024px){
  .tools .srch-box{flex:0 0 var(--srch-w,24rem)}
  .tools .flt-sel{max-width:none}
  .tools .flt-sel.flt-course{width:100%}
  .tools .bar>.btn{flex:none}
}

/* Bank Toolbar & Question List */
.tools{position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top,0px) + .5rem);z-index:20;gap:.75rem}
@media(max-width:767.98px){.tools{position:static}}
.qall{display:inline-flex;align-items:center;gap:.5rem;margin:0;color:var(--text);font-size:var(--fs-sm);font-weight:600;cursor:pointer}
.qlist{display:flex;flex-direction:column;gap:.75rem}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"sel main" "sel acts";gap:.75rem var(--space-2);padding:1rem 1.25rem;border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;background:var(--surface);transition:border-color .15s ease,background-color .15s ease}
.qrow:hover{border-color:var(--border-strong);border-left-color:var(--primary)}
.qrow:has(input:checked){background:var(--primary-soft);border-color:var(--primary);border-left-color:var(--primary)}
.qrow__sel{grid-area:sel;padding-top:.125rem}.qrow__main{grid-area:main;min-width:0}.qrow .acts{grid-area:acts;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end}
.qrow__head{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem .65rem}
.qrow__meta{margin-left:auto;font-size:var(--fs-xs);color:var(--text-muted)}
@media(max-width:767.98px){.qrow__meta{margin-left:0;width:100%}}
.qrow__text{margin:.5rem 0 .75rem;font-size:var(--fs);line-height:1.55;overflow-wrap:anywhere}
.qrow__opts{display:grid;gap:.65rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:768px){.qrow__opts{grid-template-columns:repeat(2,minmax(0,1fr))}}

.o{display:flex;align-items:center;gap:.5rem;padding:.45rem .75rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text-muted);font-size:var(--fs-sm);line-height:1.4;overflow-wrap:anywhere}
.o i{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;border-radius:50%;border:2px solid var(--border-strong);font-size:.75rem;font-weight:700;font-style:normal}
.o.on{color:var(--text);font-weight:600;background:var(--success-soft);border-color:var(--success-border)}
.o.on i{background:var(--success-strong);border-color:var(--success-strong);color:#fff}
.hide-ans .o.on{color:var(--text-muted);font-weight:400;background:var(--surface);border-color:var(--border)}
.hide-ans .o.on i{background:transparent;border-color:var(--border-strong);color:inherit}

/* Courses Grid (Môn học) */
.tgrid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(18.5rem,1fr))}
.tcard{position:relative;justify-content:space-between;min-height:17rem;padding:1.25rem;transition:border-color .15s ease,background-color .15s ease}
.tcard:hover{border-color:var(--primary);background:var(--tile)}
.tcard__main{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:.55rem;width:100%;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.tcard__top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:.5rem}
.tcard__n{font-size:1.125rem;color:var(--primary);line-height:1.35}
.tcard__dept{font-size:var(--fs-xs);color:var(--text-muted)}
.tcard__c{color:var(--text-muted);font-size:var(--fs-sm);font-weight:500}
.bt{display:block;width:100%;height:.5rem;border-radius:999px;background:var(--border);overflow:hidden}
.bt i{display:block;height:100%;background:var(--success-strong);transition:width .3s ease}
.tcard .tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto}
.tcard__foot{display:flex;justify-content:flex-end;gap:.5rem;padding-top:.85rem;border-top:1px solid var(--border);opacity:0;transition:opacity .2s ease}
.tcard:hover .tcard__foot,.tcard:focus-within .tcard__foot{opacity:1}
@media(hover:none){.tcard__foot{opacity:1}}

/* Course Sub-topics (Chương / Chủ đề con) */
.subtopic-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;padding:1rem 1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-card)}
.topic-list-mgr{display:flex;flex-direction:column;gap:.5rem}
.topic-item{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.5rem .75rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--tile)}
.topic-item input{flex:1;min-height:2.125rem;padding:.25rem .5rem}

/* Breadcrumb */
.crumb-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:.35rem}
.crumb-bar button{border:0;background:none;padding:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer}
.crumb-bar button:hover{text-decoration:underline}

/* Diff & Review */
.cmp{display:grid;gap:var(--space-2);grid-template-columns:minmax(0,1fr)}
@media(min-width:768px){.cmp{grid-template-columns:1fr 1fr}}
.cmp>div{padding:1rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--tile);line-height:1.6}
.cmp .new{background:var(--success-soft);border-color:var(--success-border)}
del.diff-del{background:var(--danger-soft);color:var(--danger-strong);text-decoration:line-through;padding:0 .2rem;border-radius:3px}
ins.diff-ins{background:#bbf7d0;color:var(--success-strong);text-decoration:none;font-weight:700;padding:0 .2rem;border-radius:3px}
.iss{margin:.25rem 0;padding-left:1.25rem;font-size:var(--fs-sm)}.iss li{margin-bottom:.4rem}

/* Tables & Codeblocks */
.tw{overflow-x:auto;max-height:28rem;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
th,td{padding:.75rem 1rem;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
thead th{position:sticky;top:0;z-index:1;background:var(--surface-hover);color:var(--text-muted);font-weight:700;white-space:nowrap}
tbody tr.clickable{cursor:pointer}tbody tr:hover{background:var(--primary-soft)}
.codeblock{max-height:26rem;overflow:auto;padding:.85rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--tile);font:.8125rem/1.5 ui-monospace,Consolas,monospace;white-space:pre;margin:0}
.codeblock.empty{white-space:pre-wrap;color:var(--text-muted)}
mark{background:#fef08a;color:var(--text);padding:0 .15rem;border-radius:2px;font-weight:600}

/* Chips */
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;min-height:2.125rem;padding:.2rem .85rem;border:1px solid var(--border);border-radius:999px;background:var(--primary-soft);color:var(--primary);font:inherit;font-size:var(--fs-xs);font-weight:600;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.chip:hover,.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip-rm{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);font-size:var(--fs-xs);font-weight:600}
.chip-rm button{border:0;background:none;color:var(--danger-strong);font-weight:700;cursor:pointer;padding:0 .15rem}

/* Empty State */
.empty-box{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.75rem;padding:2.5rem 1.5rem;border:1px dashed var(--border-strong);border-radius:12px;background:var(--surface)}
.empty-box svg{width:2.5rem;height:2.5rem;stroke:var(--text-muted);fill:none;stroke-width:1.5}

/* Selection Bar */
#selbar{position:fixed;z-index:50;left:1rem;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));max-width:74rem;margin:0 auto;display:grid;grid-template-columns:1fr;gap:.5rem;padding:.75rem 1rem;border-radius:12px;background:var(--text);color:#fff;box-shadow:0 12px 32px rgba(0,30,60,.35)}
#selbar .sel-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;width:100%}
@media(min-width:768px){
  #selbar{grid-template-columns:auto 1fr;align-items:center;gap:1rem}
  #selbar .sel-acts{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media(min-width:1024px){
  #selbar{left:18.5rem;right:1.5rem}
  .shell[data-nav=closed]~#selbar{left:1.5rem}
}
#selbar .btn{width:100%;border-color:rgba(255,255,255,.35);color:#fff;padding-inline:.5rem}#selbar .btn:hover{background:rgba(255,255,255,.15)}
#selbar .btn.pri{background:#fff;border-color:#fff;color:var(--primary)}#selbar .btn.pri:hover{background:var(--primary-soft)}
#selbar .btn.dan{background:var(--danger-strong);border-color:var(--danger-strong);color:#fff}

/* Dialog & Toast */
dialog{position:fixed;inset:0;width:min(40rem,calc(100vw - 2rem));height:fit-content;max-height:calc(100dvh - 2rem);margin:clamp(1rem,6vh,4rem) auto auto;padding:var(--space-3);overflow:auto;border:0;border-radius:12px;background:var(--surface);box-shadow:0 20px 50px rgba(0,0,0,.28);color:var(--text)}
dialog::backdrop{background:rgba(27,42,65,.55)}dialog[open]{display:flex;flex-direction:column;gap:1rem;animation:dlg-in .2s ease both}@keyframes dlg-in{from{opacity:0;transform:translateY(-.75rem)}to{opacity:1;transform:none}}
dialog h3{margin:0;color:var(--text);font-size:1.125rem}
@media(max-width:480px){dialog{width:calc(100vw - 1rem);padding:var(--space-2);margin-top:.5rem;max-height:calc(100dvh - 1rem)}dialog .end{grid-template-columns:minmax(0,1fr)}}
@media(min-width:1024px){dialog{width:min(44rem,calc(100vw - 2rem))}}
dialog .end{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin:0}dialog .end .btn{width:100%}
.opt-list{display:flex;flex-direction:column;gap:.5rem}
.opt{display:flex;gap:.65rem;align-items:center;margin:0}.opt input:not([type=radio]){flex:1}
.row{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}@media(min-width:768px){.row{grid-template-columns:1fr 1fr}}
.err{color:var(--danger-strong);font-size:var(--fs-sm);font-weight:600;margin:0}.err:empty{display:none}
.warn-inline{color:var(--warning-strong);font-size:var(--fs-xs);font-weight:600;margin:0}.warn-inline:empty{display:none}

#toast{position:fixed;left:50%;bottom:calc(5.25rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,1.5rem);display:flex;align-items:center;gap:.75rem;padding:.7rem 1.1rem;border-radius:var(--radius);background:var(--text);color:#fff;font-size:var(--fs-sm);box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none;max-width:92vw;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.ok{background:var(--success-strong)}#toast.er{background:var(--danger-strong)}#toast.wa{background:#7a4a00}
#toast button{border:1px solid rgba(255,255,255,.5);border-radius:4px;background:rgba(255,255,255,.15);color:#fff;font:inherit;font-size:var(--fs-xs);font-weight:700;padding:.2rem .55rem;cursor:pointer}
#toast button:hover{background:rgba(255,255,255,.3)}

.spin{display:inline-block;width:.75rem;height:.75rem;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
.kv{display:grid;gap:var(--space-2);grid-template-columns:minmax(0,1fr);margin:0}@media(min-width:768px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1024px){.kv{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kv>div{padding:.875rem var(--space-2);border:1px solid var(--border);border-radius:var(--radius);background:var(--tile)}.kv dt{color:var(--text-muted);font-size:var(--fs-sm)}.kv dd{font-weight:700;overflow-wrap:anywhere}
.lm{gap:.75rem}.lm__f{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}@media(min-width:1280px){.lm__f{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr)}}
.pw{display:flex;gap:.5rem;margin-top:.35rem}.pw input{flex:1;min-width:0}
.tg{display:flex;gap:.65rem;align-items:center;margin:0;color:var(--text);font-size:var(--fs-sm);cursor:pointer}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ===== Trang Thông tin tài khoản (theo CardAccount, CardInformationDetail, CardSettingTwoFA) ===== */
.acctpg{display:flex;flex-direction:column;gap:var(--space-3);width:100%;max-width:75rem;margin-inline:auto}
.pcard{display:flex;flex-direction:column;align-items:stretch;gap:var(--space-2);padding:var(--space-3) var(--space-2);background:linear-gradient(135deg,var(--primary-soft) 0%,var(--surface) 70%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card)}
.pcard__av{flex:none;align-self:center;display:grid;place-items:center;width:4.5rem;height:4.5rem;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);color:#fff;font-size:1.5rem;font-weight:700;line-height:1;user-select:none}
.pcard__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-2)}
.pcard__head{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.25rem var(--space-1)}
.pcard__name{margin:0;color:var(--text);font-size:clamp(1.25rem,1.1rem + .6vw,1.625rem);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.pcard__meta{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:var(--space-1) var(--space-3);text-align:center}

.ubd{display:inline-flex;align-items:center;gap:.375rem;padding:.25rem .75rem;border:1px solid transparent;border-radius:999px;font-size:.8125rem;font-weight:600;line-height:1.2;white-space:nowrap}

.ubd--primary{background:var(--primary-soft);color:var(--primary)}
.ubd--accent{background:var(--danger-soft);color:var(--danger-strong)}
.ubd--danger{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger-strong)}
.ubd--success{background:var(--success-soft);border-color:var(--success-border);color:var(--success-strong)}
.ubd--warning{background:var(--warning-soft,#fff4dc);border-color:var(--warning-border,#f1cf86);color:var(--warning-strong,#8a5a00)}
.icard{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-3) var(--space-2);background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--primary);border-radius:var(--radius);box-shadow:var(--shadow-card)}
.icard__hdr{display:flex;align-items:center;gap:.875rem;padding-bottom:var(--space-2);border-bottom:1px solid var(--border)}

.icard__ic svg{width:1.5rem;height:1.5rem}

.igroup{display:flex;flex-direction:column;gap:var(--space-1)}

.igroup__t::after{content:'';flex:1;height:1px;margin-left:.25rem;background:var(--border)}

.ifield__v{margin:0;color:var(--text);font-weight:600;line-height:1.5;overflow-wrap:anywhere}

.ifield__secret{font-variant-numeric:tabular-nums;letter-spacing:.08em}
.ifield__hint{flex-basis:100%;color:var(--text-muted);font-size:.75rem;font-weight:400}
.btn-rev{display:inline-flex;align-items:center;gap:.375rem;min-height:2rem;padding:0 .625rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--primary);font:inherit;font-size:.8125rem;font-weight:600;cursor:pointer}
.btn-rev svg{width:1rem;height:1rem}.btn-rev:hover{background:var(--primary-soft)}
.sk{display:block;height:1.25rem;width:60%;border-radius:4px;background:linear-gradient(90deg,var(--surface-hover) 25%,var(--border) 50%,var(--surface-hover) 75%);background-size:200% 100%;animation:skshim 1.2s linear infinite}
@keyframes skshim{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.tfa{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-2);border:1px solid var(--border);border-radius:var(--radius)}

  .tfa{flex-direction:row;align-items:center;justify-content:space-between;padding:var(--space-3)}

/* ===== 3 thẻ của trang tài khoản: vuông góc, không sticky; bảng tài khoản responsive ===== */

td small{display:block;margin-top:.2rem;color:var(--text-muted)}
/* Dựa vào chiều rộng thực của bảng vì thanh điều hướng có thể thu gọn. */

.directory-tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(11rem,16rem);gap:1rem;background:var(--surface-hover);padding:1rem;border-radius:var(--radius)}
.directory-tools label{display:grid;gap:.35rem;font-size:var(--fs-sm);font-weight:600}
.directory-tools input,.directory-tools select{width:100%;min-width:0;min-height:2.75rem;background:var(--surface)}
.accounts td,.accounts th{vertical-align:middle;padding:.85rem 1rem}

.directory-person{display:flex;align-items:center;gap:.75rem;overflow-wrap:anywhere}
.directory-avatar{display:grid;place-items:center;flex:none;width:2.6rem;height:2.6rem;background:var(--primary-soft);color:var(--primary);font-weight:700;border-radius:50%}

.accounts .policy{padding:1rem;background:var(--surface-hover);border-radius:var(--radius);margin:0}
.directory-secondary{display:flex;flex-wrap:wrap;gap:.65rem;border-top:1px solid var(--border);padding-top:1rem}
.directory-danger{color:var(--danger-strong)}
@container accounts (max-width:45rem){
  .accounts .tw{border:0;overflow:visible}
  .tbl-stack,.tbl-stack tbody{display:block}
  .tbl-stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .tbl-stack tbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:.75rem}
  .tbl-stack tbody tr{display:grid;align-content:start;gap:.65rem;padding:1rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
  .accounts td{display:block;padding:0;border:0}
  .accounts td[data-label]::before{content:attr(data-label);display:block;color:var(--text-muted);font-size:var(--fs-xs)}
  .accounts td:first-child{border-bottom:1px solid var(--border);padding-bottom:.6rem}
  .accounts td:last-child button{width:100%}
}
@container accounts (max-width:32rem){.directory-tools{grid-template-columns:1fr;gap:.65rem}}
@media(max-width:767px){.accounts .card__head>.btn{width:100%}.accounts button,.directory-secondary button{min-height:2.75rem}}

/* ===== Ô tìm kiếm môn học, chi tiết tài khoản ===== */
.csb{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-2);margin-bottom:var(--space-3)}
.csb__in{position:relative;flex:1 1 18rem;max-width:34rem}
.csb__in>svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:1.125rem;height:1.125rem;color:var(--text-muted);pointer-events:none}
.csb__input{width:100%;min-height:2.75rem;padding:.55rem 2.5rem}
.csb__input::-webkit-search-cancel-button{display:none}
.csb__clr{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);width:2rem;height:2rem;border:0;border-radius:var(--radius);background:transparent;color:var(--text-muted);font-size:1.25rem;line-height:1;cursor:pointer}
.csb__clr:hover{background:var(--surface-hover)}.csb__clr[hidden]{display:none}
.csb__n{font-size:var(--fs-sm)}
.tcard mark{background:var(--primary-soft);color:inherit;padding:0 .05em;border-radius:0;box-shadow:0 -2px 0 var(--primary-soft),0 2px 0 var(--primary-soft)}
.tw--all{max-height:none}
.udet{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem 1rem}
.udet dt{margin:0 0 .2rem;color:var(--text-muted);font-size:.8125rem}
.udet dd{margin:0;color:var(--text);font-weight:600;overflow-wrap:anywhere}
@media(max-width:479px){.udet{grid-template-columns:minmax(0,1fr)}}
.own-role{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;background:var(--surface-hover);padding:.75rem 1rem;border-radius:var(--radius);font-size:var(--fs-sm)}
.end .only-action{grid-column:1/-1}

/* ===== Phân công môn học cho giảng viên ===== */
.subj-box{border:0;margin:0;padding:0;min-width:0}
.subj-box>legend{padding:0;margin:0 0 .35rem;color:var(--text-muted);font-size:var(--fs-sm)}
.subj-box[hidden]{display:none}
.subj-list{display:grid;gap:.15rem;max-height:11rem;overflow:auto;padding:.5rem;border:1px solid var(--border);background:var(--surface)}

/* Word-level diff (LCS) */
function diffWords(oldStr,newStr){
  const a=oldStr.split(/\s+/),b=newStr.split(/\s+/),m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=a[i]===b[j]?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,outOld=[],outNew=[];
  while(i<m&&j<n){
    if(a[i]===b[j]){outOld.push(esc(a[i]));outNew.push(esc(b[j]));i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1]){outOld.push(`<del class="diff-del">${esc(a[i])}</del>`);i++}
    else{outNew.push(`<ins class="diff-ins">${esc(b[j])}</ins>`);j++}
  }
  while(i<m)outOld.push(`<del class="diff-del">${esc(a[i++])}</del>`);
  while(j<n)outNew.push(`<ins class="diff-ins">${esc(b[j++])}</ins>`);
  return{oldHtml:outOld.join(' '),newHtml:outNew.join(' ')};
}

/* Mô phỏng Qwen2.5: Server 2 gọi Colab và trả JSON đã chuẩn hóa */
const TYPO={'ngử':'ngữ','dử liệu':'dữ liệu'};
function llm(q){
  const is=[];let tx=q.text;
  for(const k in TYPO)if(tx.includes(k)){is.push({k:'Chính tả',d:`“${k}” nên viết chuẩn chính tả là “${TYPO[k]}”`});tx=tx.split(k).join(TYPO[k])}
  if(!/[?:.]$/.test(tx.trim())){is.push({k:'Ngữ pháp',d:'Câu dẫn thiếu dấu kết thúc câu (?)'});tx=tx.trim()+'?'}
  if(new Set(q.o.map(x=>x.trim().toLowerCase())).size<4)is.push({k:'Phương án nhiễu',d:'Có hai phương án trùng nội dung nên không có giá trị phân loại thí sinh'});
  const L=q.o.map(x=>x.length);
  if(L[q.a]>1.6*Math.max(...L.filter((_,i)=>i!=q.a)))is.push({k:'Logic',d:'Đáp án đúng dài và chi tiết hơn hẳn các phương án nhiễu nên dễ bị đoán trúng'});
  const high=is.some(x=>x.k=='Logic'||x.k=='Phương án nhiễu');
  return{is,tx,diff:LV[Math.min(2,Math.floor(q.text.length/40))],sev:high?'Cao':'Trung bình'}
}

function runAI(ids){
  let n=0;
  ids.forEach(id=>{
    const q=S.q.find(x=>x.id==id);
    if(!q||S.tasks.some(t=>t.qid==id&&/pending|running/.test(t.st)))return;
    n++;
    const t={id:'T-'+String(S.tn++).padStart(4,'0'),qid:id,st:'pending',ms:0,t0:Date.now(),started:new Date().toLocaleTimeString('vi-VN'),msg:''};
    S.tasks.unshift(t);
    if(S.tasks.length>50)S.tasks.length=50;
    setTimeout(()=>{t.st='running';draw()},600);
    setTimeout(()=>{
      t.ms=Date.now()-t.t0;
      if(!S.colab){
        t.st='failed';t.msg='Dịch vụ LLM không khả dụng (hết thời gian chờ)';
        log(`Tác vụ ${t.id} (${code(q)}) thất bại do mất kết nối LLM`,'er');
        toast(t.id+' thất bại có kiểm soát – quản lý câu hỏi vẫn hoạt động','er');
      }else{
        const r=llm(q);t.st='succeeded';
        t.msg=r.is.length?`Phát hiện ${r.is.length} vấn đề · Độ khó gợi ý: ${r.diff}`:'Đạt chuẩn, không phát hiện lỗi';
        if(r.is.length){
          S.sug=S.sug.filter(s=>s.qid!=id);
          S.sug.push({qid:id,tx:r.tx,is:r.is,diff:r.diff,sev:r.sev,tid:t.id});
          q.st='flag';
          log(`Hoàn tất ${t.id} (${code(q)}): có ${r.is.length} đề xuất AI`,'wa');
        }else{
          q.st='ok';
          log(`Hoàn tất ${t.id} (${code(q)}): câu hỏi đạt chuẩn`,'ok');
        }
      }
      draw();
    },2200+Math.random()*1000);
  });
  if(!n)return toast('Các câu hỏi được chọn đang có tác vụ chạy, không tạo trùng','wa');
  log(`Tiếp nhận ${n} tác vụ kiểm định AI`,'info');
  toast(`Đã tiếp nhận ${n} tác vụ – theo dõi ở mục “Tác vụ AI”`,'ok');
  draw();
}

/* Ô gõ-tìm môn học / chương (datalist) dùng chung cho hộp thoại sửa câu hỏi (cf) và nhập XML (imp) */
function pickIdx(arr,lbls,v,loose){
  v=(v||'').trim().toLowerCase();if(!v)return -1;
  let i=arr.findIndex(x=>lbls(x).some(l=>l.toLowerCase()==v));
  if(i<0&&loose){const m=arr.map((x,k)=>lbls(x).some(l=>l.toLowerCase().includes(v))?k:-1).filter(k=>k>=0);if(m.length==1)i=m[0]}
  return i;
}

/* Ô chọn môn học có lọc khi gõ (không dấu cũng được); danh sách chỉ hiện TÊN môn, không có mã */
const norm=t=>(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase();
const CB={flt:{cur:()=>S.f.c===''?-1:+S.f.c,pick:i=>{S.f.c=i<0?'':String(i);S.f.page=1;render()},all:true}};
function cbHtml(p,cur,ph,cls=''){return`<div class="cb${cls}"><input id="${p}-c" class="cb-in ${p=='flt'?'flt-sel':''}" role="combobox" aria-expanded="false" aria-controls="${p}-lb" aria-autocomplete="list" autocomplete="off" placeholder="${ph}" value="${esc(COURSES[cur]?.name||'')}" onfocus="this.select();cbOpen('${p}',1)" onclick="cbOpen('${p}',1)" oninput="cbOpen('${p}')" onkeydown="cbKey(event,'${p}')" onblur="cbClose('${p}',1)"><button type="button" class="cb-btn" tabindex="-1" aria-label="Mở danh sách môn học" onmousedown="event.preventDefault()" onclick="cbToggle('${p}')">▾</button><ul id="${p}-lb" class="cb-list" role="listbox" hidden onmousedown="cbDown(event,'${p}')" onclick="event.preventDefault()"></ul></div>`}
function cbOpen(p,all){const el=$('#'+p+'-c'),lb=$('#'+p+'-lb');if(!el||!lb)return;const c=CB[p],q=all?'':norm(el.value.trim()),cur=c.cur();
  const li=COURSES.map((x,i)=>[x,i]).filter(([x,i])=>subjOk(i)&&(c.all||x.active!==false||i==cur)&&(!q||norm(x.name).includes(q)||norm(x.id).includes(q)));
  lb.innerHTML=(c.all&&!q?`<li role="option" data-i="" class="${cur<0?'on':''}">Tất cả môn học</li>`:'')+li.map(([x,i])=>`<li role="option" data-i="${i}" class="${i==cur?'on':''}">${esc(x.name)}</li>`).join('')||'<li class="none">Không tìm thấy môn học phù hợp</li>';
  lb.hidden=false;el.setAttribute('aria-expanded','true');if(lb.getBoundingClientRect().bottom>innerHeight)el.scrollIntoView({block:'center'});const on=lb.querySelector('.on');if(on)lb.scrollTop=Math.max(0,on.offsetTop-lb.clientHeight/2+on.clientHeight/2)}
function cbDown(e,p){e.preventDefault();const li=e.target.closest('li[data-i]');if(li)cbPick(p,li.dataset.i)}
function cbPick(p,i){const c=CB[p],el=$('#'+p+'-c');i=i===''?-1:+i;if(el&&p!='flt')el.value=COURSES[i]?.name||'';cbClose(p);c.pick(i)}
function cbToggle(p){const lb=$('#'+p+'-lb');if(lb.hidden){$('#'+p+'-c').focus();cbOpen(p,1)}else cbClose(p)}
function cbKey(e,p){const lb=$('#'+p+'-lb');if(lb.hidden){if(e.key=='ArrowDown'){e.preventDefault();cbOpen(p,1)}return}
  const li=[...lb.querySelectorAll('li[data-i]')];let k=li.findIndex(x=>x.classList.contains('act'));
  if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();k=e.key=='ArrowDown'?Math.min(li.length-1,k+1):Math.max(0,k-1);li.forEach(x=>x.classList.remove('act'));if(li[k]){li[k].classList.add('act');li[k].scrollIntoView({block:'nearest'})}}

function dec(id,ok){
  const s=S.sug.find(x=>x.qid==id),q=S.q.find(x=>x.id==id);
  if(!s||!q)return;
  const prev={text:q.text,st:q.st,updatedAt:q.updatedAt,by:q.by},sugBackup={...s};
  if(ok){
    q.text=s.tx;q.updatedAt=nowStr();q.by=S.name+' (Duyệt AI)';
    log(`Chấp nhận đề xuất AI cho ${code(q)} (có lưu vết)`,'ok');
  }else{
    log(`Từ chối đề xuất AI cho ${code(q)}, giữ nội dung gốc`,'info');
  }
  q.st='ok';S.sug=S.sug.filter(x=>x.qid!=id);S.rsel.delete(id);render();
  toast(ok?`Đã cập nhật ${code(q)} theo đề xuất AI`:`Đã giữ nguyên bản gốc ${code(q)}`,ok?'ok':'','Hoàn tác',()=>{

function bulkDec(ok){
  const ids=[...S.rsel].filter(id=>S.sug.some(s=>s.qid==id));
  if(!ids.length)return toast('Hãy chọn ít nhất một đề xuất để xử lý','wa');
  ids.forEach(id=>{
    const s=S.sug.find(x=>x.qid==id),q=S.q.find(x=>x.id==id);
    if(ok&&s&&q){q.text=s.tx;q.updatedAt=nowStr();q.by=S.name+' (Duyệt AI)'}

    S.nlKw=F.keyword||s;const c=[F.course!==undefined&&'course_id = ?',F.level!==undefined&&'level = ?',F.keyword&&'content LIKE ?'].filter(Boolean);
    const js={course:F.course===undefined?null:`${COURSES[F.course].id} – ${COURSES[F.course].name}`,level:F.level===undefined?null:LV[F.level],keyword:F.keyword||null};
    const hlText=t=>{

function xin(){
  const v=$('#xi').value,d=new DOMParser().parseFromString(v,'application/xml'),e=$('#xr');
  if(!v.trim()||d.querySelector('parsererror'))return e.innerHTML='<p class="err">XML trống hoặc sai cấu trúc nên chưa thể lưu. Hãy kiểm tra lại các thẻ đóng/mở.</p>';
  let ok=0,reasons=[];
  const tx=(n,s)=>((n.querySelector(s)||{}).textContent||'').replace(/<[^>]+>/g,'').trim(),full=n=>parseFloat(n.getAttribute('fraction'))==100;
  d.querySelectorAll('question[type="multichoice"]').forEach((x,idx)=>{
    const a=[...x.querySelectorAll(':scope > answer')],t=tx(x,'questiontext > text'),label=tx(x,'name > text')||`Câu #${idx+1}`;
    if(!t){reasons.push(`${label}: thiếu nội dung câu dẫn`);return}
    if(a.length!=4){reasons.push(`${label}: có ${a.length} phương án (yêu cầu đúng 4)`);return}
    if(a.some(n=>!tx(n,'text'))){reasons.push(`${label}: có phương án để trống`);return}
    if(a.filter(full).length!=1){reasons.push(`${label}: có ${a.filter(full).length} đáp án đúng (yêu cầu đúng 1)`);return}
    S.q.push({id:S.n++,text:t,o:a.map(n=>tx(n,'text')),a:a.findIndex(full),c:S.imp.c,tp:S.imp.tp,l:S.imp.l,st:'draft',updatedAt:nowStr(),by:S.name+' (Moodle)',src:'moodle_import',ver:1});
    ok++;
  });
  dlgDirty=false;
  const crs=COURSES[S.imp.c];
  log(`Nhập Moodle XML: ${ok} thành công, ${reasons.length} bỏ qua`,ok?'ok':'wa');
  if(ok&&!reasons.length){
    $('#dlg').close();
    render();
    toast(`Đã lưu ${ok} câu vào ${crs.id} – ${crs.name}`,'ok');
    return;
  }
  if(ok)render();
  e.innerHTML=`<p><span class="b ok">Đã lưu ${ok} câu</span> <span class="b ${reasons.length?'wa':'n'}">Bỏ qua ${reasons.length}</span></p>
    <small>Các câu nhập vào được gán môn <b>${esc(crs.id)} – ${esc(crs.name)}</b> (${esc(topicName(S.imp.c,S.imp.tp))}), mức độ <b>${LV[S.imp.l]}</b>.</small>
    ${reasons.length?`<ul class="iss" style="margin-top:.5rem">${reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}`;
}

  review(){

    ${filtered.map(s=>{
      const q=S.q.find(x=>x.id==s.qid),df=diffWords(q.text,s.tx),same=q.text===s.tx,json=JSON.stringify({taskId:s.tid,questionId:code(q),valid:true,issues:s.is.map(i=>({type:i.k,description:i.d})),suggestedText:same?null:s.tx,suggestedDifficulty:LV_DB[LV.indexOf(s.diff)]||null,severity:ENUM_DB.sev[s.sev]||'low'},null,2);

        <div class="bar">
          <input type="checkbox" aria-label="Chọn đề xuất ${code(q)}" ${S.rsel.has(s.qid)?'checked':''} onchange="this.checked?S.rsel.add(${s.qid}):S.rsel.delete(${s.qid});render()">

function delCourseTopic(ci,idx){

  const c=S.lm[i],u=(c.url||'').trim(),t=(c.tok||'').trim();let bad=0;
  if(!u)bad+=fErr($('#lu'+i),'URL đang trống. Hãy nhập địa chỉ dịch vụ suy luận.');else if(!/^https?:\/\/\S+$/.test(u))bad+=fErr($('#lu'+i),'URL phải bắt đầu bằng http:// hoặc https:// và không chứa khoảng trắng.');
  if(!t)bad+=fErr($('#tk'+i),'Token đang trống. Hãy dán token của LLM này.');
  if(bad)return fFocus($('#lm'+i));
  c.url=u;c.tok=t;log('Lưu cấu hình LLM '+(i+1),'ok');render();toast('Đã lưu LLM '+(i+1),'ok');
}

function render(){
  if(/^(admin|llm)$/.test(S.page)&&S.role!='admin')S.page='dash';
  const cur=NAV.concat(EXTRA).find(n=>n[0]==S.page),nm=S.name||'Từ Quang Nhật',w=nm.split(' '),ini=(w.length>1?w[0][0]+w[w.length-1][0]:nm.slice(0,2)).toUpperCase();
  $('#menu').innerHTML=NAV.filter(n=>!/^(admin|llm)$/.test(n[0])||S.role=='admin').map(([k,g,t],i,a)=>{
    const h=i&&g!=a[i-1][1]?`<p class="nav-group">${g}</p>`:'';
    const n=k=='review'?S.sug.length:k=='tasks'?act():0;
    return`${h}<button type="button" class="nv ${k==S.page||(k=='courses'&&S.page=='course')?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg><span>${t}</span>${n?`<em aria-label="${n} mục mới">${n}</em>`:''}</button>`;
  }).join('');

  const crs=COURSES[S.ci];
  $('#crumb').innerHTML=S.page=='course'&&crs?`<div class="crumb-bar"><button type="button" onclick="go('courses')">‹ Môn học</button><span>/</span><span><b>${esc(crs.id)}</b> · ${esc(crs.name)}</span></div>`:'';
  $('#ttl').textContent=S.page=='course'&&crs?`${crs.id} – ${crs.name}`:cur[2];
  $('#sub').textContent=S.page=='courses'?`${SUB.courses} (hiện có ${COURSES.length} môn học).`:S.page=='course'&&crs?`${crs.dept||'Chưa có mô tả'} · ${crs.topics.length} chương/chủ đề con`:SUB[S.page];

  if(S.page=='dash'){
    $('#pact').innerHTML=`<button class="btn pri" onclick="edit(0)">Thêm câu hỏi</button>`;
  }else if(S.page=='courses'){
    $('#pact').innerHTML=`<button class="btn pri" onclick="cdlg()">Thêm môn học</button>`;
  }else if(S.page=='course'){
    $('#pact').innerHTML=`<button class="btn sm" onclick="cedit(${S.ci})">Sửa môn học</button><button class="btn sm dan" onclick="cdel(${S.ci})">Xóa môn học</button>`;
  }else if(S.page=='moodle'){
    $('#pact').innerHTML=`<button class="btn pri" onclick="impDlg()">Nhập Moodle XML</button>`;
  }else{
    $('#pact').innerHTML='';
  }

  $('#acn').textContent=nm;$('#acr').textContent=S.role=='admin'?'Quản trị viên':'Giảng viên';
  document.querySelectorAll('.js-av').forEach(e=>e.textContent=ini);

  if(/^(bank|course)$/.test(S.page)){
    window._rmf=[];
    const f=S.f;
    if(f.q)window._rmf.push(()=>{S.f.q='';render()});
    if(S.page=='bank'&&f.c!=='')window._rmf.push(()=>{S.f.c='';render()});
    if(S.page=='course'&&f.tp!=='')window._rmf.push(()=>{S.f.tp='';render()});
    if(f.l!=='')window._rmf.push(()=>{S.f.l='';render()});
    if(f.s!=='')window._rmf.push(()=>{S.f.s='';render()});
  }

  const ae=document.activeElement,aid=ae&&ae.id&&!ae.classList.contains('cb-in')&&$('#view').contains(ae)?ae.id:'',ss=aid?ae.selectionStart:null;$('#view').innerHTML=P[S.page]();
  if(/^(bank|course)$/.test(S.page)&&$('#tb'))rows();else cnt();
  const nf=aid&&document.getElementById(aid);if(nf&&nf!==document.activeElement){nf.focus();try{if(ss!=null)nf.setSelectionRange(ss,ss)}catch(e){}}
  fitSearch();
}

function previewRole(v){const[r,id]=String(v).split(':');if(!['admin','gv'].includes(r))return;S.role=r;S.asId=r==='gv'?id:null;S.cq='';render();const pr=$('#preview-role');if(pr)pr.focus();toast('Đã đổi chế độ xem','ok')}
const mq=matchMedia('(min-width:768px)');
const setNav=o=>{$('#app').dataset.nav=o?'open':'closed';$('#mt').setAttribute('aria-expanded',o)};
const tm=()=>setNav($('#app').dataset.nav!='open');
const am=o=>{$('#am').hidden=!o;$('#ab').setAttribute('aria-expanded',o)};
const ta=()=>am($('#am').hidden);
const go=p=>{if(p!=S.page&&p!='bank')S.f={q:'',c:'',tp:'',l:'',s:'',sort:'id',page:1,hideAns:S.f.hideAns};S.page=p;am(false);if(!mq.matches)setNav(false);render();scrollTo(0,0)};

mq.addEventListener('change',e=>setNav(e.matches));
document.addEventListener('click',e=>{if(!e.target.closest('.acct'))am(false)});
$('#acct-wrap').addEventListener('focusout',e=>{if(!$('#acct-wrap').contains(e.relatedTarget))am(false)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#am').hidden){am(false);$('#ab').focus()}
  if(e.key==='/'&&/^(bank|course)$/.test(S.page)&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();$('#q-srch')?.focus()}
});

$('#yr').textContent=new Date().getFullYear();S.name='Từ Quang Nhật';S.t0=new Date().toLocaleTimeString('vi-VN');
setNav(mq.matches);go('admin');
$('#dlg').addEventListener('input',apiPrev);$('#dlg').addEventListener('change',apiPrev);
document.addEventListener('input',e=>fClr(e.target));document.addEventListener('change',e=>fClr(e.target));
document.fonts?.addEventListener('loadingdone',fitSearch);document.fonts?.load('400 14px "Be Vietnam Pro"').then(fitSearch,()=>{});
</script>
</body>
</html>
