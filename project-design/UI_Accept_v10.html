/* Modal: Bootstrap Modal JS bọc quanh #dlg; giữ API cũ showModal / close / open để các hàm khác không đổi.
   Không tải được Bootstrap (offline) thì dùng bản dự phòng tối giản. */
(()=>{const el=$('#bsm'),d=$('#dlg');
  /* Dùng Bootstrap Modal khi cả JS lẫn CSS đã tải xong; chưa tải được thì dùng bản dự phòng với cùng hành vi
     (role=dialog, khóa focus, Esc, nút Đóng, nền inert). Chọn theo thời điểm mở, nên không phụ thuộc thứ tự tải. */
  const bsOk=()=>!!(window.bootstrap&&bootstrap.Modal)&&!!getComputedStyle(document.documentElement).getPropertyValue('--bs-blue').trim();
  let inst=null,useBs=false,isOpen=false,force=false,timer=0,bd=null;
  Object.defineProperty(d,'open',{get:()=>isOpen});
  el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  const struct=()=>{if(d.querySelector(':scope>.modal-body'))return;
    const h3=d.querySelector(':scope>h3'),end=d.querySelector(':scope>.end'),body=document.createElement('div'),head=document.createElement('div');
    body.className='modal-body';[...d.childNodes].forEach(n=>{if(n!==h3&&n!==end)body.appendChild(n)});
    head.className='modal-header';if(h3){h3.className='modal-title';h3.id='dlg-t';head.appendChild(h3)}
    head.insertAdjacentHTML('beforeend','<button type="button" class="dlg-x" data-bs-dismiss="modal" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>');
    d.replaceChildren(head,body);if(end){end.classList.add('modal-footer');d.appendChild(end)}el.setAttribute('aria-labelledby','dlg-t')};
  const askHide=()=>{const ev=new Event('hide.bs.modal',{cancelable:true});el.dispatchEvent(ev);if(!ev.defaultPrevented)fbHide()};
  const lock=on=>['#app','#selbar'].forEach(q=>{const n=$(q);if(n)n.inert=on});
  const fbShow=()=>{el.style.display='block';el.classList.add('show');el.removeAttribute('aria-hidden');document.body.classList.add('modal-open');bd=document.createElement('div');bd.className='modal-backdrop show';document.body.appendChild(bd);setTimeout(()=>el.dispatchEvent(new Event('shown.bs.modal')),0)};
  const fbHide=()=>{el.style.display='none';el.classList.remove('show');el.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');if(bd){bd.remove();bd=null}el.dispatchEvent(new Event('hidden.bs.modal'))};
  /* Bản dự phòng: Esc đóng, Tab quay vòng trong hộp thoại (Bootstrap tự làm việc này khi có) */
  const items=()=>[...el.querySelectorAll('a[href],button,input,select,textarea,[tabindex]')].filter(n=>!n.disabled&&n.tabIndex>=0&&n.type!=='hidden'&&!n.closest('[hidden]')&&n.getClientRects().length);
  document.addEventListener('keydown',e=>{if(useBs||!isOpen||e.defaultPrevented)return;
    if(e.key==='Escape'){e.preventDefault();askHide();return}
    if(e.key==='Tab'){const f=items();if(!f.length){e.preventDefault();return}const a=document.activeElement,inside=el.contains(a);
      if(e.shiftKey&&(a===f[0]||!inside)){e.preventDefault();f[f.length-1].focus()}
      else if(!e.shiftKey&&(a===f[f.length-1]||!inside)){e.preventDefault();f[0].focus()}}});
  el.addEventListener('click',e=>{if(!useBs&&e.target.closest('.dlg-x'))askHide()});
  /* Chạm/nhấp ra ngoài modal thì đóng (qua hide.bs.modal nên vẫn hỏi xác nhận khi form nhập dở).
     Hộp thoại chứa bí mật chỉ hiện một lần (khóa 2FA, mật khẩu tạm) thì không đóng bằng nền, Esc hay nút X: chỉ rung nhẹ và nhắc. */
  const locked=()=>!!d.querySelector('.tfa-key');let down=false;
  const nudge=()=>{el.classList.add('modal-static');setTimeout(()=>el.classList.remove('modal-static'),300);toast('Thông tin này chỉ hiển thị một lần. Hãy sao chép lại, rồi dùng nút bên dưới để đóng.','wa')};
  el.addEventListener('mousedown',e=>{down=e.target===el},true);
  el.addEventListener('click',e=>{const out=down&&e.target===el;down=false;if(!out)return;
    if(locked()){e.stopImmediatePropagation();nudge();return}
    if(!useBs)askHide()},true);
  d.showModal=function(){if(timer){clearTimeout(timer);timer=0;force=false}struct();if(isOpen)return;isOpen=true;d._op=document.activeElement;
    useBs=bsOk();if(useBs&&!inst)inst=new bootstrap.Modal(el,{backdrop:true,keyboard:true,focus:true});
    lock(true);useBs?inst.show():fbShow()};
  d.close=function(){if(!isOpen)return;force=true;clearTimeout(timer);timer=setTimeout(()=>{timer=0;useBs?inst.hide():fbHide()},0)};
  el.addEventListener('hide.bs.modal',e=>{if(force)return;if(locked()){e.preventDefault();nudge();return}if(dlgDirty){if(!confirm('Bạn đang nhập dở dữ liệu. Bạn có chắc muốn đóng và bỏ thay đổi?')){e.preventDefault();return}dlgDirty=false}});
  el.addEventListener('shown.bs.modal',()=>{const t=d.querySelector('[data-af],.modal-body input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([disabled]),.modal-body textarea,.modal-body select')||d.querySelector('.modal-footer .btn');if(t)t.focus({preventScroll:true})});
  el.addEventListener('hidden.bs.modal',()=>{isOpen=false;force=false;lock(false);const o=d._op,alt=d._alt;d._op=d._alt=null;d.dispatchEvent(new Event('close'));
    if(o&&o!==document.body&&document.contains(o)&&!o.disabled)o.focus();
    else{const a=alt&&$(alt),h=a||$('#ttl');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}});
  /* Enter: ở hộp thoại ngắn thì xác nhận; ở form có ô nhiều dòng thì cần Ctrl/⌘+Enter. Ô có data-enter="none" tự xử lý Enter. */
  d.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.defaultPrevented||e.isComposing)return;const t=e.target;if(t.closest&&t.closest('[data-enter="none"]'))return;
    const multi=!!d.querySelector('.modal-body textarea'),mod=e.ctrlKey||e.metaKey,
      ok=(t.tagName==='INPUT'&&!/^(checkbox|radio|button|submit)$/.test(t.type)&&(!multi||mod))||(t.tagName==='TEXTAREA'&&mod);
    if(!ok)return;const b=d.querySelector('.modal-footer .btn.pri:not(:disabled)');if(b){e.preventDefault();b.click()}});
})();
$('#yr').textContent=new Date().getFullYear();S.name='Từ Quang Nhật';S.t0=new Date().toLocaleTimeString('vi-VN');
setNav(mq.matches);{const r=routeHash();if(r&&r.ci!=null)S.ci=r.ci;go(r?r.p:DEFAULT_PAGE)}
$('#dlg').addEventListener('input',apiPrev);$('#dlg').addEventListener('change',apiPrev);
document.addEventListener('input',e=>fClr(e.target));document.addEventListener('change',e=>fClr(e.target));
document.fonts?.addEventListener('loadingdone',fitSearch);document.fonts?.load('400 14px "Be Vietnam Pro"').then(fitSearch,()=>{});
</script>
</body>
</html>
