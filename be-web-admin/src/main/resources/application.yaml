server:
  port: 8080
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
    context-path: /api
  # Backend chạy sau nginx/proxy thì bật để request.getRemoteAddr() trả IP thật (X-Forwarded-For).
  # Nếu client gọi thẳng vào Spring Boot (không qua proxy) thì XÓA dòng này, vì header có thể bị giả mạo.
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 20
      min-spare: 5
    max-connections: 1000
    accept-count: 20

gg:
  jte:
    developmentMode: false

# ===================== CẤU HÌNH ỨNG DỤNG (2FA & BẢO MẬT) =====================
app:
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    # Cổng CŨ (5173/5174/5375) giữ nguyên để demo trực tiếp bằng Vite như trước.
    # Cổng MỚI thêm vào cho môi trường Docker:
    #   5176 = QBank Console qua NGINX    |  8085 = fe_web_admin qua NGINX
    # Cũng khai tên miền giả (*.local) vì khi chạy qua NGINX, origin mà trình
    # duyệt gửi lên là "http://qbank.local:5176", KHÔNG phải localhost:5176.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5375,http://127.0.0.1:5375,http://localhost:5176,http://127.0.0.1:5176,http://localhost:8085,http://127.0.0.1:8085,http://qbank.local:5176,http://admin.local:8085}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    default-password: ${APP_SEED_DEFAULT_PASSWORD:}
  crypto:
    # Phiên bản khóa dùng để MÃ HÓA bản ghi mới. Được lưu vào ntt_totp_credentials.key_version.
    # Muốn xoay khóa: thêm khóa mới vào "keys", tăng active-version, giữ khóa cũ cho đến khi
    # không còn bản ghi nào dùng phiên bản đó.
    active-version: 2
    keys:
      # Base64 của 32 byte ngẫu nhiên: openssl rand -base64 32
      # KHÔNG có giá trị mặc định: thiếu biến môi trường thì ứng dụng không khởi động (fail-fast).
      2: ${TOTP_MASTER_KEY_V2}
    # Chuỗi MASTER_SECRET cũ (đã lộ trong Git). CHỈ dùng cho bước di chuyển dữ liệu một lần
    # (giải mã bản ghi cũ bằng PBKDF2). Xóa dòng này sau khi di chuyển xong.
    legacy-master-secret: ${TOTP_LEGACY_MASTER_SECRET:}
  totp:
    confirm-window-minutes: 10      # thời gian mobile phải xác nhận sau khi bấm "Kích hoạt"
    confirm-max-attempts: 5         # số lần nhập sai mã xác nhận tối đa
#    enroll-session-ttl-seconds: 300 # thời gian sống của khóa chờ ở Redis (modal)

  # ===================== SERVER 2 (AI worker / Colab Ollama) =====================
  # Dùng cho module ngân hàng câu hỏi: POST /web/ai/tasks rồi poll trạng thái.
  # Bỏ trống base-url => tính năng "Kiểm định AI" trả 503 AI_WORKER_NOT_CONFIGURED,
  # KHÔNG tạo task "treo" trong ntt_ai_tasks (task không ai xử lý còn tệ hơn lỗi rõ ràng).
  ai-worker:
    base-url: ${AI_WORKER_BASE_URL:}          # vd http://127.0.0.1:8082/api (worker có context-path /api)
    internal-token: ${AI_INTERNAL_TOKEN:}     # phải trùng app.ai.security.internal-token của worker
    connect-timeout-ms: 3000
    read-timeout-ms: 20000

spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:be-web-admin/.env[.properties]"
  #  rabbitmq:
  #    host: localhost
  #    port: 5672
  #    username: admin
  #    password: StrongPass!123

  # Nên giữ tên trùng với project (be-web-admin) để log/monitoring dễ đọc.
  application:
    name: be-web-admin

  # Redis: tách riêng từng thuộc tính thay vì ghép url, vì mật khẩu có ký tự đặc biệt
  # (@ : / # ...) trong URL sẽ làm sai cú pháp và rất khó debug.
  data:
    redis:
      host: ${IP_ADDRESS}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DBS}
      connect-timeout: 2000ms
      timeout: 1000ms

  datasource:
    # MariaDB Connector/J bỏ qua serverTimezone, useUnicode, characterEncoding (đó là tham số của MySQL
    # Connector) và không có usePingMethod, nên bỏ cho gọn. Múi giờ được đặt ở hibernate.jdbc.time_zone bên dưới.
    url: jdbc:mariadb://${IP_ADDRESS}:${MARIADB_PORT}/${MARIADB_DBS}
    username: ${MARIADB_USERNAME}
    password: ${MARIADB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 900000          # phải nhỏ hơn wait_timeout của MariaDB
      minimum-idle: 5
      maximum-pool-size: 10
      pool-name: HikariPool-Fast
      auto-commit: true
      leak-detection-threshold: 20000   # cảnh báo nếu giữ kết nối quá 20s (dễ gặp khi BCrypt nằm trong transaction)

  jpa:
    open-in-view: false
    hibernate:
      # CSDL có sẵn và do bạn quản lý bằng script SQL: khi production đã chạy đủ script SQL, đặt JPA_DDL_AUTO=validate trong .env.
      # Giữ mặc định "update" để tương thích dev local chưa chạy hết script ALTER/chat mới.
      ddl-auto: ${JPA_DDL_AUTO:update}
    # Tắt show-sql: trùng với org.hibernate.SQL và in ra console không qua logger.
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # Cột datetime(6) ánh xạ với Instant: luôn đọc/ghi theo UTC.
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Second-level cache TẮT: hiện không có entity JPA nào gắn @Cache (chỉ có 2 class Redis gắn nhầm),
        # nên bật chỉ tốn cấu hình. Cache cũng không nên chứa dữ liệu nhạy cảm (secret_cipher, code_hash).
        # Muốn bật lại thì khóa đúng là hibernate.javax.cache.provider (không có thêm ".cache.").
        cache:
          use_second_level_cache: false
          use_query_cache: false

  docker:
    compose:
      enabled: false

logging:
  level:
    root: INFO
    com.zaxxer.hikari: WARN
    # Không bật DEBUG/TRACE ở môi trường thật. BasicBinder TRACE in GIÁ TRỊ tham số của câu SQL,
    # tức là ghi vào log hash mật khẩu, secret_cipher, iv, code_hash, refresh_token_hash.
    # Cần debug thì đặt trong application-dev.yml (profile dev), không đặt ở file chung.
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# ===================== CHAT GIỮA CÁC ADMIN (chỉ văn bản) =====================
# Mọi con số của module chat (xem ChatProperties). Giá trị bên dưới là mặc định, xóa dòng nào thì dùng mặc định trong mã.
chat:
  ws:
    # Origin pattern được phép bắt tay WebSocket. Ứng dụng mobile gốc không gửi
    # Origin nên luôn qua.
    # Nhóm CŨ: Flutter web 5375, Vue admin 5374/5173 — giữ để demo trực tiếp.
    # Nhóm MỚI: 5176/8085 (Docker) và tên miền giả *.local — BẮT BUỘC, vì khi
    # chạy qua NGINX trình duyệt gửi Origin: http://qbank.local:5176, không
    # khớp danh sách cũ thì handshake bị trả 403 và chat không kết nối được.
    allowed-origin-patterns:
      - http://localhost:5375
      - http://localhost:5374
      - http://localhost:5173
      - http://127.0.0.1:5375
      - http://127.0.0.1:5374
      - http://127.0.0.1:5173
      - http://localhost:5176
      - http://127.0.0.1:5176
      - http://localhost:8085
      - http://127.0.0.1:8085
      - http://qbank.local:5176
      - http://admin.local:8085
    ticket-ttl-seconds: 30        # hạn của vé mở WebSocket (dùng một lần)
    ping-interval-seconds: 25     # chu kỳ ping đề xuất cho client
    idle-timeout-seconds: 50      # đóng kết nối im lặng quá lâu (nhỏ hơn mốc 60s của Nginx)
    max-connections-per-admin: 5  # web + điện thoại + dự phòng
    send-time-limit-ms: 5000
    send-buffer-bytes: 65536
  message:
    max-length: 2000              # ký tự Unicode
  group:
    min-members: 3                # gồm cả chủ nhóm
    max-members: 50
    max-name-length: 100
  page:
    default-size: 30
    max-size: 100
  rate:
    messages: 20                  # tin mỗi window-seconds
    window-seconds: 10
    tickets-per-minute: 10
    searches-per10-seconds: 20
    new-conversations-per-minute: 10
