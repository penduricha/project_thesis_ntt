server:
  port: ${SPRING_BOOT_PORT}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
    context-path: /api
  # [THÊM] Tắt êm: chờ các request web đang chạy xong. Phần tác vụ AI đang chạy do consumer xử lý
  # (dừng nhận việc mới, chờ xong hoặc trả task về pending), chạy trong thời gian lifecycle bên dưới.
  shutdown: graceful
  # Backend chạy sau nginx/proxy thì bật để request.getRemoteAddr() trả IP thật (X-Forwarded-For).
  # Nếu client gọi thẳng vào Spring Boot (không qua proxy) thì XÓA dòng này, vì header có thể bị giả mạo.
  # Server AI thường chỉ có vài endpoint nội bộ: nếu không đứng sau proxy thì xóa dòng này.
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 20
      min-spare: 5
    max-connections: 1000
    accept-count: 20

gg:
  jte:
    developmentMode: false

# ===================== CẤU HÌNH ỨNG DỤNG (2FA) =====================

spring:
  config:
    import: "optional:file:.env[.properties]"
  #  rabbitmq:
  #    host: localhost
  #    port: 5672
  #    username: admin
  #    password: StrongPass!123

  # Tên dùng cho log/monitoring: Server AI đã đặt be-server-ai (khác Server 1).
  application:
    name: be-server-ai

  # [THÊM] Thời gian chờ mỗi pha tắt máy. Phải lớn hơn ai.llm.read-timeout (120s) để một lần gọi Colab
  # đang chạy kịp kết thúc và ghi kết quả.
  lifecycle:
    timeout-per-shutdown-phase: 150s

  # Redis: tách riêng từng thuộc tính thay vì ghép url, vì mật khẩu có ký tự đặc biệt
  # (@ : / # ...) trong URL sẽ làm sai cú pháp và rất khó debug.
  # Server AI nên dùng user Redis riêng (ACL) chỉ có quyền trên khóa ai:* (REDIS_USERNAME trong .env).
  data:
    redis:
      host: ${IP_ADDRESS}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DBS}
      connect-timeout: 2000ms
      # [SỬA] 1000ms -> 10s. Lettuce áp dụng timeout này cho cả lệnh chặn như BRPOP, bất kể thời gian chặn
      # của riêng lệnh. BRPOP chờ lâu hơn timeout sẽ ném RedisCommandTimeoutException.
      # Giữ ai.orchestrator.queue-block (5s) nhỏ hơn giá trị này.
      timeout: 10s

  datasource:
    # MariaDB Connector/J bỏ qua serverTimezone, useUnicode, characterEncoding (đó là tham số của MySQL
    # Connector) và không có usePingMethod, nên bỏ cho gọn. Múi giờ được đặt ở hibernate.jdbc.time_zone bên dưới.
    url: jdbc:mariadb://${IP_ADDRESS}:${MARIADB_PORT}/${MARIADB_DBS}
    # Server AI nên dùng user DB riêng (ví dụ ntt_s2) chỉ có quyền: SELECT trên ntt_ai_tasks, ntt_issue_types;
    # UPDATE theo cột trên ntt_ai_tasks; INSERT, SELECT trên ntt_ai_suggestions.
    username: ${MARIADB_USERNAME}
    password: ${MARIADB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 900000          # phải nhỏ hơn wait_timeout của MariaDB
      minimum-idle: 5
      maximum-pool-size: 10         # đủ: kết nối chỉ giữ trong transaction ngắn, không giữ lúc chờ Colab
      pool-name: HikariPool-Fast
      auto-commit: true
      leak-detection-threshold: 20000   # cảnh báo nếu giữ kết nối quá 20s (nếu thấy cảnh báo: có transaction bao quanh lời gọi Colab)

  jpa:
    open-in-view: false
    hibernate:
      # DEMO: CSDL ntt_demo_llm còn trống nên dùng "update": Hibernate tự tạo 3 bảng ntt_ai_tasks, ntt_ai_suggestions,
      # ntt_issue_types theo entity (chưa có khóa ngoại, CHECK, trigger của ER v4; đủ để chạy demo).
      # Khi dùng CSDL đã có script ER v4 của Server 1 thì đổi thành "none" (Hibernate không được tự sửa schema)
      # và đặt ai.demo.seed-issue-types=false.
      ddl-auto: update
    # Tắt show-sql: trùng với org.hibernate.SQL và in ra console không qua logger.
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # Cột datetime(6) ánh xạ với Instant: luôn đọc/ghi theo UTC.
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Second-level cache TẮT: không entity JPA nào gắn @Cache; bật chỉ tốn cấu hình.
        # Cache cũng không nên chứa dữ liệu nhạy cảm (nội dung câu hỏi, kết quả AI).
        # Muốn bật lại thì khóa đúng là hibernate.javax.cache.provider (không có thêm ".cache.").
        cache:
          use_second_level_cache: false
          use_query_cache: false

  docker:
    compose:
      enabled: false

# ===================== [THÊM] CẤU HÌNH TÁC VỤ AI (Server 2) =====================
# Gắn vào lớp AiProperties (@ConfigurationProperties, prefix "ai").
# URL và token Colab đổi mỗi lần Colab khởi động lại: nhập trên trang node-colab.html (lưu trong bộ nhớ Server AI).
# Có thể điền sẵn AI_NODE_n_URL / AI_NODE_n_TOKEN trong .env để tự nạp khi khởi động; để trống cũng chạy được.
ai:
  llm:
    model: qwen2.5:14b-instruct-q4_K_M
    prompt-version: v1
    connect-timeout: 5s
    # Dưới 125s (Proxy Read Timeout của Cloudflare). Notebook test dùng 180-300s chỉ để thử.
    read-timeout: 120s
    keep-alive: 30m
    # Chỉ nhận URL node có đuôi miền này (chặn việc dùng Server AI để gọi địa chỉ nội bộ).
    allowed-host-suffixes:
      - .trycloudflare.com
    # Giá trị khởi đầu lấy từ notebook test; num-predict hạ vì mỗi task chỉ một câu hỏi (notebook gửi lô 5 câu
    # với 2500). Chỉnh lại sau khi đo. Cùng giá trị cho mọi node, ghi vào ntt_ai_tasks.params_json.
    question-check:
      num-ctx: 8192
      num-predict: 1024
      temperature: 0.0
    # num-ctx của hai loại task phải bằng nhau: Ollama nạp lại mô hình khi num_ctx đổi giữa hai request.
    nl-search:
      num-ctx: 8192
      num-predict: 512
      temperature: 0.0
  # Mỗi node là một cặp URL + token (một tài khoản Colab). Node chưa có URL hoặc token thì tự bị bỏ qua khi chia việc,
  # nên để enabled=true cho cả 5 ô cũng không sao. Giá trị sau dấu ":" là mặc định khi .env không có biến đó
  # (thiếu dấu ":" thì Spring báo lỗi "Could not resolve placeholder" lúc khởi động).
  nodes:
    - name: colab-1
      url: ${AI_NODE_1_URL:}
      token: ${AI_NODE_1_TOKEN:}
      max-concurrency: 3            # OLLAMA_NUM_PARALLEL=3 trong notebook Colab
      enabled: ${AI_NODE_1_ENABLED:true}
    - name: colab-2
      url: ${AI_NODE_2_URL:}
      token: ${AI_NODE_2_TOKEN:}
      max-concurrency: 3
      enabled: ${AI_NODE_2_ENABLED:true}
    - name: colab-3
      url: ${AI_NODE_3_URL:}
      token: ${AI_NODE_3_TOKEN:}
      max-concurrency: 3
      enabled: ${AI_NODE_3_ENABLED:true}
    - name: colab-4
      url: ${AI_NODE_4_URL:}
      token: ${AI_NODE_4_TOKEN:}
      max-concurrency: 3
      enabled: ${AI_NODE_4_ENABLED:true}
    - name: colab-5
      url: ${AI_NODE_5_URL:}
      token: ${AI_NODE_5_TOKEN:}
      max-concurrency: 3
      enabled: ${AI_NODE_5_ENABLED:true}
  orchestrator:
    max-attempts: 5                 # khớp CHECK attempt_count 1..5 của ER
    max-wait: 10m                   # chờ hàng đợi quá mức này thì failed (QUEUE_TIMEOUT)
    fail-threshold: 3               # lỗi liên tiếp trước khi node vào cooldown
    cooldown: 60s
    cooldown-max: 5m
    queue-block: 5s                 # thời gian chặn của BRPOP; phải nhỏ hơn spring.data.redis.timeout
    sweeper-interval: 60s
    stuck-after: 5m                 # task running quá mức này coi là kẹt, job quét đưa về pending hoặc failed
  # Chỉ dùng khi demo: Server AI đóng vai Server 1 để tạo task. Phải là admin_id có thật trong ntt_admins.
  demo:
    created-by: ${AI_DEMO_CREATED_BY:1}
    # Bảng ntt_issue_types rỗng thì nạp sẵn spelling, logic, presentation, none (chỉ để demo).
    seed-issue-types: ${AI_DEMO_SEED_ISSUE_TYPES:true}

logging:
  level:
    root: INFO
    com.zaxxer.hikari: WARN
    # Không bật DEBUG/TRACE ở môi trường thật. BasicBinder TRACE in GIÁ TRỊ tham số của câu SQL,
    # tức là ghi vào log nội dung câu hỏi và kết quả AI (cùng các cột nhạy cảm của Server 1).
    # Cần debug thì đặt trong application-dev.yml (profile dev), không đặt ở file chung.
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    # [THÊM] Không bật DEBUG cho HTTP client (RestClient, Apache HttpClient, Netty): có thể in header
    # Authorization chứa token Colab.
